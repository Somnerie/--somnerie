  /* ============ 浮动面板：折叠 + 拖动（桌面鼠标即按即拖，触屏长按触发） ============ */
  const sidePanel = document.getElementById('sidePanel');
  const sideHead = document.getElementById('sideHead');
  const collapseBtn = document.getElementById('collapseBtn');
  const LONG_PRESS_MS = 350;   // 触屏长按多久后进入拖动模式
  const MOVE_CANCEL_PX = 8;    // 长按计时期间，手指移动超过这个距离视为误触，取消拖动

  let dragState = null;      // 正式进入拖动后才有值：{ id, sx, sy, ox, oy }
  let pendingTouch = null;   // 触屏按下、长按计时器还没触发前的中间状态
  let longPressTimer = null;

  function startDrag(pointerId, startX, startY) {
    const rect = sidePanel.getBoundingClientRect();
    dragState = { id: pointerId, sx: startX, sy: startY, ox: rect.left, oy: rect.top };
    sideHead.setPointerCapture(pointerId);
    sideHead.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12); // 触觉反馈；不支持的设备会静默忽略
  }
  function endDrag() {
    clearTimeout(longPressTimer);
    pendingTouch = null;
    if (dragState) {
      dragState = null;
      sideHead.classList.remove('dragging');
    }
  }
  function clampPanelToViewport() {
    if (sidePanel.classList.contains('collapsed')) {
      sidePanel.style.left = 'auto';
      sidePanel.style.right = '8px';
      sidePanel.style.top = '50%';
      return;
    }
    const rect = sidePanel.getBoundingClientRect();
    const margin = 4;
    const maxLeft = window.innerWidth - rect.width - margin;
    const maxTop = window.innerHeight - rect.height - margin;
    const left = Math.min(Math.max(rect.left, margin), Math.max(margin, maxLeft));
    const top = Math.min(Math.max(rect.top, margin), Math.max(margin, maxTop));
    sidePanel.style.left = left + 'px';
    sidePanel.style.top = top + 'px';
    // 关键：改用 left 定位后必须清掉 right，否则 left/right 同时生效时，
    // 折叠态 width:auto 会按“填满左右间距”计算宽度（占满整行）而不是收缩成小块。
    sidePanel.style.right = 'auto';
  }

  sideHead.addEventListener('pointerdown', (e) => {
    if (e.target === collapseBtn) return;
    if (sidePanel.classList.contains('collapsed')) return;
    if (e.pointerType === 'touch') {
      pendingTouch = { id: e.pointerId, x: e.clientX, y: e.clientY };
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (pendingTouch && pendingTouch.id === e.pointerId) {
          startDrag(pendingTouch.id, pendingTouch.x, pendingTouch.y);
          pendingTouch = null;
        }
      }, LONG_PRESS_MS);
      return;
    }
    // 桌面端：鼠标按下即可直接拖动，不需要长按
    startDrag(e.pointerId, e.clientX, e.clientY);
  });
  sideHead.addEventListener('pointermove', (e) => {
    // 长按计时器还没触发时，手指已经明显移动 → 判定为误触（比如只是想点一下），取消长按
    if (pendingTouch && pendingTouch.id === e.pointerId && !dragState) {
      if (Math.hypot(e.clientX - pendingTouch.x, e.clientY - pendingTouch.y) > MOVE_CANCEL_PX) {
        clearTimeout(longPressTimer);
        pendingTouch = null;
      }
      return;
    }
    if (!dragState || e.pointerId !== dragState.id) return;
    sidePanel.style.left = (dragState.ox + e.clientX - dragState.sx) + 'px';
    sidePanel.style.top = (dragState.oy + e.clientY - dragState.sy) + 'px';
    sidePanel.style.right = 'auto';
  });
  sideHead.addEventListener('pointerup', (e) => {
    const wasDragging = !!dragState && dragState.id === e.pointerId;
    endDrag();

  });
  sideHead.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', clampPanelToViewport);

  function syncCollapseUI() {
    const collapsed = sidePanel.classList.contains('collapsed');

      sidePanel.style.left = 'auto';
      sidePanel.style.right = '8px';
      sidePanel.style.top = '50%';
    } else {
      sidePanel.style.right = '16px';
      sidePanel.style.top = '72px';
    }

  });
  syncCollapseUI();

  /* ============ 顶栏工具栏：折叠 / 展开（原有机制，不受写入/编辑模式影响） ============ */
  const appBar = document.getElementById('appBar');

  toolbarToggle.addEventListener('click', () => {

      document.querySelectorAll('.toolbar').forEach(el => el.classList.add('collapsed'));

  /* ============ 写入模式 / 编辑模式 ============
   * 只做一件事：控制画布能不能调出键盘、能不能打字，不碰任何 UI 折叠/展开
   * 状态——工具栏折叠、样式面板折叠完全是上面 toolbarToggle 那套独立机制，
   * 写入/编辑模式切换时原样保持，不做任何改动。
   *   写入模式（默认）：canvas.contentEditable = true，可以正常调出键盘打字；
   *   编辑模式：canvas.contentEditable = false，浏览器不会弹出屏幕键盘、也
   *             不接受任何键入/输入法/粘贴产生的文字，但鼠标/触摸依然可以
   *             正常选中已有文字（浏览器对非 contenteditable 元素默认也允许
   *             选中/复制文本），选中后仍可点击加粗/颜色/字号等按钮调格式
   *             ——这些操作都是直接操作 DOM/style，不依赖 contenteditable。
   * 只切 contentEditable 属性和按钮的 active 态，不重新创建/清空画布，不碰
   * canvas.innerHTML，撤销栈、已保存内容、自动保存都不受影响；切换前后额外
   * 保存/恢复一次选区，避免点按钮本身（导致画布失焦）让当前选区/光标看起来

  const modeWriteBtn = document.getElementById('modeWriteBtn');
  const modeEditBtn = document.getElementById('modeEditBtn');
  let currentEditorMode = 'write';
  function setMode(mode, focusBack = true) {
    const sel = window.getSelection();

    const savedRange = hasCanvasSelection ? sel.getRangeAt(0).cloneRange() : null;

    modeEditBtn.setAttribute('aria-pressed', String(editing));

      try {

        if (savedRange) { sel.removeAllRanges(); sel.addRange(savedRange); }
      } catch (e) { /* 恢复失败不影响功能，静默忽略 */ }
    });
  }

  modeEditBtn.addEventListener('click', () => setMode('edit'));

  /* 段落 / 字体 / 画布 三行各自折叠 */

  /* ============ 移动端画布缩放 ============ */
  let mobileZoom = 1;
  function isMobileLayout() { return window.matchMedia('(max-width: 720px)').matches; }
  function applyMobileZoom() {
    if (!isMobileLayout()) {
      canvas.style.removeProperty('--editor-zoom');

      canvas.style.transformOrigin = '';
      canvas.style.marginBottom = '';

  /* ============ 导出图片（html2canvas + JSZip） ============
   * 普通导出 scale=2；高清导出允许更高倍率。分片导出先生成完整高清图，
   * 再按用户指定高度切成多张 PNG，最后使用 JSZip 打成一个 ZIP。
   */
  /* ============ 高亮导出：按“实际换行结果”把跨行高亮拆成多个按行矩形 ============
   * 背景（为什么要单独处理）：
   * 网页里高亮就是一个 <span style="background-color:...; padding:...">，跨行时浏览器原生
   * 会按每一行分别画背景，显示完全正常。但导出用的 html2canvas 在处理“带左右 padding、
   * 又跨行的行内元素”时，是按这个 span 的一个整体包围盒画背景的，于是跨行高亮在导出图片里
   * 会变成一个覆盖多行的大矩形（这是 html2canvas 自身对“带 padding 的跨行 inline 元素”
   * 处理不精确导致的，不是本项目原有导出坐标转换逻辑的问题）。
   *
   * 解法：span 决定“选中了哪些文字”，交给浏览器 Range.getClientRects() 得到这些文字
   * 实际排完版后分成了几行、每行的真实几何范围（这一步和网页显示用的是完全同一套
   * 浏览器排版结果，因此换行宽度改变后会自动跟着变，不依赖任何保存下来的行数/坐标）。
   * 拿到每行的矩形后：
   *   1) 上下 padding 每行都补上；左 padding 只补在第一行、右 padding 只补在最后一行
   *      （这跟浏览器对“跨行 inline 元素”的 padding 处理规则一致）。
   *   2) 除最后一行外，其余每一行本来就是因为“碰到了段落的换行边界”才换的行，
   *      所以视觉上应该延伸到该段落排版区域的对应边界，而不是停在这一行最后一个字符的
   *      实际宽度上——但只在段落是左对齐/两端对齐（默认排版方向）时才延伸右边界，
   *      右对齐时延伸左边界，居中对齐时行的位置本身就没有贴边界，不做延伸。
   *   3) 最后一行永远只按实际文字范围（可能只是半行）。
   * 这一步只影响“导出阶段怎么画高亮矩形”，不会改动画布里的 span 结构、不插入 <br>、
   * 也不会碰当前的文字选区。
   */
  function isHighlightSpan(sp) {
    const bg = sp.style.backgroundColor;
    if (!bg || bg === 'transparent') return false;
    const m = /rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(?:,\s*([\d.]+)\s*)?\)/.exec(bg);
    if (m && m[1] !== undefined && parseFloat(m[1]) === 0) return false;
    return true;
  }
  function collectHighlightSpans() {
    return Array.from(canvas.querySelectorAll('span')).filter(isHighlightSpan);
  }
  function collectHighlightRects() {
    const result = [];
    collectHighlightSpans().forEach(span => {
      let rects;
      try {
        const range = document.createRange();
        range.selectNodeContents(span);
        rects = Array.from(range.getClientRects()).filter(r => r.width > 0.5 && r.height > 0.5);
      } catch (e) { return; }
      if (!rects.length) return;
      // 按 top 归并成“行”：同一行的多个 rect（例如高亮内部还有细分的行内节点）合并成一个横向矩形。
      rects.sort((a, b) => a.top - b.top || a.left - b.left);
      const lines = [];
      rects.forEach(r => {
        const last = lines[lines.length - 1];
        if (last && Math.abs(r.top - last.top) < Math.max(2, last.height * 0.34)) {
          last.left = Math.min(last.left, r.left);
          last.right = Math.max(last.right, r.right);
          last.top = Math.min(last.top, r.top);
          last.bottom = Math.max(last.bottom, r.bottom);
        } else {
          lines.push({ left: r.left, right: r.right, top: r.top, bottom: r.bottom });
        }
      });
      const cs = getComputedStyle(span);
      const padTop = parseFloat(cs.paddingTop) || 0;
      const padBottom = parseFloat(cs.paddingBottom) || 0;
      const padLeft = parseFloat(cs.paddingLeft) || 0;
      const padRight = parseFloat(cs.paddingRight) || 0;
      const color = cs.backgroundColor;
      const block = blockOf(span);
      let align = 'left', contentLeft = null, contentRight = null;
      if (block) {
        align = getComputedStyle(block).textAlign;
        const br = block.getBoundingClientRect();
        const bcs = getComputedStyle(block);
        contentLeft = br.left + (parseFloat(bcs.paddingLeft) || 0);
        contentRight = br.right - (parseFloat(bcs.paddingRight) || 0);
      }
      lines.forEach((ln, idx) => {
        const isFirst = idx === 0;
        const isLast = idx === lines.length - 1;
        let left = ln.left, right = ln.right;
        // 非末行：视为“已经排到本段换行边界”的完整行，按对齐方式延伸到对应边界；
        // 居中对齐时该行本身不贴边界，保持实测范围。
        if (!isLast && block) {
          if (align === 'right') left = contentLeft;
          else if (align !== 'center') right = contentRight;
        }
        if (isFirst && !(!isLast && block && align === 'right')) left -= padLeft;
        if (isLast) right += padRight;
        result.push({
          left, right,
          top: ln.top - padTop,
          bottom: ln.bottom + padBottom,
          color,
        });
      });
    });
    return result.map(r => ({ left: r.left, top: r.top, width: r.right - r.left, height: r.bottom - r.top, color: r.color }))
      .filter(r => r.width > 0.5 && r.height > 0.5);
  }
  // 导出前临时把所有高亮 span 的背景色隐藏（保留 padding/其它样式不变），
  // 让 html2canvas 只负责画“纸面 + 文字”，高亮矩形另外手动合成；返回一个还原函数。
  function suppressHighlightBackgrounds() {
    const spans = collectHighlightSpans();
    const saved = spans.map(sp => sp.style.backgroundColor);
    spans.forEach(sp => { sp.style.backgroundColor = 'transparent'; });
    return function restore() { spans.forEach((sp, i) => { sp.style.backgroundColor = saved[i]; }); };
  }

  function ensureExportLibraries() {
    if (typeof html2canvas !== 'function') {
      alert('图片导出组件还没加载完成，请检查网络连接后重试');
      return false;
    }
    return true;
  }

  async function renderCanvasImage(scale) {
    await document.fonts.ready; 
    if (!canvas.textContent.trim() && canvas.children.length === 0) {
      alert('画布是空的，请先粘贴或输入内容');
      return null;
    }
    const currentEls = Array.from(canvas.querySelectorAll('.current'));
    currentEls.forEach(el => el.classList.remove('current'));
    const saved = {
      transform: canvas.style.transform,
      transformOrigin: canvas.style.transformOrigin,
      marginBottom: canvas.style.marginBottom,
    };
    canvas.style.transform = '';
    canvas.style.transformOrigin = '';
    canvas.style.marginBottom = '';
    // 坐标转换沿用原有逻辑：html2canvas 直接对 canvas 元素截图，输出像素 = 页面坐标差 × scale，
    // 这里只是把「页面坐标 → 输出图片坐标」这套换算，从 html2canvas 内部隐式的换算，
    // 复用到我们手动画的高亮矩形上，没有引入新的坐标系统。
    const paperColor = getComputedStyle(canvas).backgroundColor;
    const canvasRect = canvas.getBoundingClientRect();
    const highlightRects = collectHighlightRects();
    const restoreHighlight = highlightRects.length ? suppressHighlightBackgrounds() : null;
    try {
      if (!highlightRects.length) {
        // 没有任何高亮：跟修改前完全一样，直接截图，不引入额外合成开销/风险。
        return await html2canvas(canvas, {
          backgroundColor: paperColor,
          scale,
          useCORS: true,
          logging: false,
          letterRendering: true, 
        });
      }
      // 有高亮：先截一张“透明底、只有文字/图片”的前景图（高亮背景已被临时隐藏），
      // 再手动按 纸面 → 高亮 → 文字 的顺序合成，让高亮始终画在文字下面，不会盖住文字。
      // 注意：html2canvas 即使传入 backgroundColor:null，仍会把画布 #canvas 元素自身的背景色
      // （canvas.css 的 background:var(--surface)，或用户在“画布背景”里设置的 color）画进前景图，
      // 让前景图变成不透明，从而盖住下方手画的高亮矩形。所以必须在截图时把画布背景也临时隐藏、
      // 截完立即还原。这不影响 paperColor（它在上面已用原始背景读取，用于填充 out）。
      const savedCanvasBg = canvas.style.background;
      canvas.style.background = 'transparent';
      let contentLayer;
      try {
        contentLayer = await html2canvas(canvas, {
          backgroundColor: null,
          scale,
          useCORS: true,
          logging: false,
          letterRendering: true, 
        });
      } finally {
        if (savedCanvasBg) canvas.style.background = savedCanvasBg;
        else canvas.style.removeProperty('background');
      }
      const out = document.createElement('canvas');
      out.width = contentLayer.width;
      out.height = contentLayer.height;
      const ctx = out.getContext('2d');
      ctx.fillStyle = paperColor;
      ctx.fillRect(0, 0, out.width, out.height);
      highlightRects.forEach(r => {
        ctx.fillStyle = r.color;
        ctx.fillRect(
          (r.left - canvasRect.left) * scale,
          (r.top - canvasRect.top) * scale,
          r.width * scale,
          r.height * scale
        );
      });
      ctx.drawImage(contentLayer, 0, 0);
      return out;
    } finally {
      if (restoreHighlight) restoreHighlight();
      currentEls.forEach(el => el.classList.add('current'));
      // 用 removeProperty 避免空字符串覆盖 CSS 文件中的 transform
      if (saved.transform) canvas.style.transform = saved.transform;
      else canvas.style.removeProperty('transform');
      if (saved.transformOrigin) canvas.style.transformOrigin = saved.transformOrigin;
      else canvas.style.removeProperty('transformOrigin');
      if (saved.marginBottom) canvas.style.marginBottom = saved.marginBottom;
      else canvas.style.removeProperty('marginBottom');
    }
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportToPng(scale = 2, label = '图片', fileBaseName = '') {
    if (!ensureExportLibraries()) return;
    const btn = document.getElementById('exportMenuBtn'); const old = btn.textContent; btn.textContent = '生成中…'; btn.disabled = true;
    try {
      const outCanvas = await renderCanvasImage(scale); if (!outCanvas) return;
      const blob = await new Promise(resolve => outCanvas.toBlob(resolve, 'image/png')); if (!blob) throw new Error('toBlob failed');
      const base = sanitizeFileName(fileBaseName, '长图-' + label);
      downloadBlob(blob, base.endsWith('.png') ? base : base + '.png');
    } catch (err) { console.error('导出失败', err); alert('导出失败，请重试或查看控制台。'); }
    finally { btn.textContent = old; btn.disabled = false; }
  }
  async function exportSplitZip(fileBaseName = '') {
    if (!ensureExportLibraries()) return;
    if (typeof JSZip !== 'function') { alert('压缩组件还没加载完成，请检查网络连接后重试'); return; }
    const outPreview = await renderCanvasImage(1); if (!outPreview) return;
    const totalW = outPreview.width, totalH = outPreview.height;
    const info = `当前图片总尺寸：${totalW} × ${totalH} px。\n请输入每张切片的高度（像素），建议 2048～4096：`;
    const heightRaw = await showTextInputModal(info, '4096', '下一步'); if (heightRaw === null) return;
    const sliceHeight = Number(heightRaw);
    if (!Number.isInteger(sliceHeight) || sliceHeight < 1 || sliceHeight > 16384) { alert('切片高度必须是 1～16384 之间的整数。'); return; }
    const suggested = fileBaseName || '长图切片';
    const filename = await showTextInputModal('请输入 ZIP 文件名：', suggested, '导出'); if (filename === null) return;
    const btn = document.getElementById('exportMenuBtn'); const old = btn.textContent; btn.textContent='切片中…'; btn.disabled=true;
    try {
      const outCanvas = await renderCanvasImage(2); if (!outCanvas) return;
      const zip = new JSZip(); const total = Math.ceil(outCanvas.height / sliceHeight);
      for (let i=0; i<total; i++) { const y=i*sliceHeight, h=Math.min(sliceHeight,outCanvas.height-y); const part=document.createElement('canvas'); part.width=outCanvas.width; part.height=h; const ctx=part.getContext('2d'); ctx.drawImage(outCanvas,0,y,outCanvas.width,h,0,0,outCanvas.width,h); const blob=await new Promise(r=>part.toBlob(r,'image/png')); if(!blob) throw new Error('slice toBlob failed'); zip.file(`${sanitizeFileName(filename,'长图切片')}-${String(i+1).padStart(3,'0')}.png`,blob); }
      const zipBlob = await zip.generateAsync({type:'blob',compression:'STORE'}); downloadBlob(zipBlob, sanitizeFileName(filename,'长图切片').replace(/\.zip$/i,'')+'.zip');
    } catch (err) { console.error('切片导出失败',err); alert('切片导出失败，请重试或查看控制台。'); }
    finally { btn.textContent=old; btn.disabled=false; }
  }
  const exportMenuBtn = document.getElementById('exportMenuBtn');
  const exportMenu = document.getElementById('exportMenu');
  exportMenuBtn.addEventListener('click', () => { exportMenu.hidden=!exportMenu.hidden; });
  exportMenu.querySelectorAll('[data-export-action]').forEach(item => item.addEventListener('click', async () => {
    exportMenu.hidden=true; const action=item.dataset.exportAction;
    if (action === 'png') { const n=await showTextInputModal('请输入图片文件名：','长图-图片','导出'); if(n!==null) await exportToPng(2,'图片',n); }
    else if (action === 'png-hd') { const n=await showTextInputModal('请输入高清图片文件名：','长图-高清图片','导出'); if(n!==null) await exportToPng(4,'高清图片',n); }
    else if (action === 'split-zip') { await exportSplitZip(); }
    else if (action === 'json') { const n=await showTextInputModal('请输入数据文件名：','长图草稿','导出'); if(n!==null) await exportDataJson(n); }
  }));
  document.addEventListener('click', e => { if (!e.target.closest('.export-menu-wrap')) exportMenu.hidden=true; });


  function updateCanvasMetrics() {
    const rect = canvas.getBoundingClientRect();
    const width = Math.round(canvas.scrollWidth || rect.width);
    const height = Math.round(canvas.scrollHeight);
    const el = document.getElementById('canvasMetrics');
    if (el) el.textContent = `画布：宽 ${width} px × 高 ${height} px`;
  }
  const canvasResizeObserver = new ResizeObserver(updateCanvasMetrics);
  canvasResizeObserver.observe(canvas);
  new MutationObserver(updateCanvasMetrics).observe(canvas, {childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['style','class']});

  const themeToggleBtn = document.getElementById('themeToggleBtn');
  function applyTheme(theme) {
    document.body.dataset.theme = theme;
    themeToggleBtn.textContent = theme === 'light' ? ' ❀ ' : ' ✿ ';
    themeToggleBtn.title = theme === 'light' ? '切换夜间主题' : '切换日间主题';
    try { localStorage.setItem('longimage-ui-theme', theme); } catch (e) {}
  }
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('longimage-ui-theme') || 'dark'; } catch (e) {}
  applyTheme(savedTheme === 'light' ? 'light' : 'dark');
  themeToggleBtn.addEventListener('click', () => applyTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light'));

  // 打开/刷新时默认：模式=写入（可以打字）；工具栏折叠状态与模式无关，
  // 单独按原来的默认值来——只折叠工具行，画布区（展示区）默认展示、不折叠。
  setMode('write', false); // 第二个参数 false：初始化阶段不抢焦点、不弹移动端键盘
  document.body.classList.add('editor-collapsed');
  toolbarToggle.title = '展开编辑区';
  toolbarToggle.setAttribute('aria-expanded', 'false');
  document.querySelectorAll('.toolbar').forEach(el => el.classList.add('collapsed'));
  sidePanel.classList.add('collapsed');
  syncCollapseUI();


  /* ==== 启动：先下载并加载内置资源（字体等），成功后进入；
     内置资源/字体缺失 → 允许进入 + 用系统字体暂代 + 提示（按你给的流程）。 ==== */
  (async function boot() {
    showBoot(true);
    let missing = [];
    let manifestOk = false;
    try {
      const resp = await fetch('font/fontsv.1.0.2.json');
      if (!resp.ok) throw new Error('fontsv.1.0.2.json HTTP ' + resp.status);
      const data = await resp.json();
      FONT_MANIFEST = data.fonts || [];
      manifestOk = true;
      const styleEl = document.createElement('style');
      styleEl.textContent = FONT_MANIFEST.map(f => `
        @font-face {
          font-family: '${f.family}';
          src: url('font/${f.file}') format('${f.format || guessFormat(f.file)}');
          ${f.weight ? `font-weight: ${f.weight};` : ''}
          font-display: swap;
        }
      `).join('\n');
      document.head.appendChild(styleEl);
      missing = await loadFontsFromManifest(FONT_MANIFEST);
      buildFontSelects(FONT_MANIFEST);
    } catch (e) {
      console.error('字体清单/字体加载失败：', e);
    }
    // 进入网站：先完成 IndexedDB 项目恢复，再进入（避免默认内容闪现/覆盖用户项目）
    await restoreProject();
    normalizeAll();
    updateUndoButtons();
    updateSelectionUI();
    render();
    showBoot(false);
    // 缺失字体：允许进入 + fallback + 提示
    if (!manifestOk) {
      showToast('字体清单 fonts.json 加载失败，当前使用系统字体。\n请确认 font/fonts.json 存在（可运行扫描脚本生成），并用本地服务器/部署访问。', 6000);
    } else if (missing.length) {
      showToast('以下字体缺失或加载失败，已用系统字体代替：\n' + missing.join('\n'), 6000);
    }
  })();
</script>
