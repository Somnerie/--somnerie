<style id="publicStyles">
  /* ==== 字体：JS 用 FontFace API 从 font/fonts.json 动态加载，CSS 不写死任何字体路径 ==== */
  /* ==== 启动遮罩：等内置资源（字体等）加载完成后再进入网站 ==== */
  .boot-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10000; }
  .boot-overlay.hidden { display: none; }
  .boot-box { text-align: center; color: var(--text-secondary); max-width: 78vw; }
  .boot-spinner { width: 40px; height: 40px; border: 3px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; animation: bootSpin 1s linear infinite; }
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  .boot-text { font-size: 14px; line-height: 1.7; }
  .boot-hint { margin-top: 8px; font-size: 12px; color: var(--text-tertiary); white-space: pre-line; }
  /* 非阻塞提示条（如缺失字体提示） */
  .boot-toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 10001;
    background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px; line-height: 1.6; box-shadow: var(--shadow-float);
    max-width: min(92vw, 520px); white-space: pre-line; }

  /* ==== 导入下拉菜单（与导出菜单同款样式） ==== */
  .import-menu-wrap { position: relative; display: inline-flex; }
  .import-menu { position: absolute; left: 0; top: calc(100% + 6px); min-width: 132px; display: flex; flex-direction: column;
    padding: 5px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: var(--shadow-float); z-index: 180; }
  .import-menu[hidden] { display: none; }
  .import-menu button { background: transparent; border: none; color: var(--text); text-align: left; font: inherit;
    font-size: 14px; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
    transition: background var(--transition-fast); }
  .import-menu button:hover { background: var(--hover); }
  /* 移动端两行布局：把「导入」下拉容器放到下行中间 */
  @media (max-width: 720px) {
    .import-menu-wrap { grid-area: 2 / 2; }
  }

  /* ==== 一键回到页面顶端/底端：悬浮按钮，始终钉在左下/右下角。样式参考「模板收起」时的折叠小按钮，再小 20%。
     这两个按钮真正悬浮于页面主体之上，使用 float 级阴影；按下时转为 inset 凹陷，呼应 Soft UI 的按压手感。 ==== */
  .float-nav-btn {
    position: fixed; z-index: 140;
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 40px; padding: 0;
    font-size: 15px; line-height: 1; color: var(--text-tertiary);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    cursor: pointer; font-family: inherit;
    box-shadow: var(--shadow-float);
    transition: background .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .float-nav-btn:hover { background: var(--hover); color: var(--text); transform: translateY(-1px); }
  .float-nav-btn:active { box-shadow: var(--shadow-inset); transform: translateY(0); }
  .float-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #toTopBtn { left: 16px; bottom: 16px; }
  #toBottomBtn { right: 16px; bottom: 16px; }

  /* ==== 编辑区折叠（打开/刷新时默认开启）：只折叠工具行，画布区默认展示、不折叠 ==== */
  body.editor-collapsed .app-bar-body { display: none; }
</style>

<script src="js/project-storage.js"></script>
<script>
  const canvas = document.getElementById('canvas');
  const styleBlock = document.getElementById('templateStyles');
  const templateList = document.getElementById('templateList');

  let templates = [];
  let tplSeq = 0;
  const BLOCK_TAGS = ['P', 'DIV', 'H1', 'H2', 'H3', 'BLOCKQUOTE', 'LI'];

  // Enter 统一生成 <p>，保证段落/行距一致
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

  let activeBlocks = [];
  let pendingBlocks = [];
  let inlineRange = null;

  /* ============ 撤销/重做：快照式（保留选区） ============ */
  let undoStack = [];
  let redoStack = [];
  const MAX_UNDO = 50;

  // 用 childNode 索引路径序列化选区，避免 Range 无法 JSON 序列化的问题
  function getNodePath(node) {
    const path = [];
    let cur = node;
    while (cur && cur !== canvas) {
      const parent = cur.parentNode;
      if (!parent) break;
      path.unshift(Array.from(parent.childNodes).indexOf(cur));
      cur = parent;
    }
    return path;
  }
  function getNodeByPath(path) {
    let node = canvas;
    for (const idx of path) {
      if (!node.childNodes[idx]) return null;
      node = node.childNodes[idx];
    }
    return node;
  }
  function captureSelection() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !canvas.contains(sel.getRangeAt(0).commonAncestorContainer)) return null;
    const r = sel.getRangeAt(0);
    return {
      startPath: getNodePath(r.startContainer),
      startOffset: r.startOffset,
      endPath: getNodePath(r.endContainer),
      endOffset: r.endOffset,
    };
  }
  function restoreSelection(record) {
    if (!record) return;
    try {
      const startNode = getNodeByPath(record.startPath);
      const endNode = getNodeByPath(record.endPath);
      if (!startNode || !endNode) return;
      const r = document.createRange();
      r.setStart(startNode, Math.min(record.startOffset, startNode.nodeType === 3 ? startNode.textContent.length : startNode.childNodes.length));
      r.setEnd(endNode, Math.min(record.endOffset, endNode.nodeType === 3 ? endNode.textContent.length : endNode.childNodes.length));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) { /* 选区恢复失败静默处理 */ }
  }

  function snapshot() {
    undoStack.push({ html: canvas.innerHTML, selection: captureSelection() });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoButtons();
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push({ html: canvas.innerHTML, selection: captureSelection() });
    const record = undoStack.pop();
    canvas.innerHTML = record.html;
    activeBlocks = [];
    restoreSelection(record.selection);
    updateSelectionUI();
    updateUndoButtons();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push({ html: canvas.innerHTML, selection: captureSelection() });
    const record = redoStack.pop();
    canvas.innerHTML = record.html;
    activeBlocks = [];
    restoreSelection(record.selection);
    updateSelectionUI();
    updateUndoButtons();
  }
  function updateUndoButtons() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) { e.preventDefault(); redo(); }
      else if (undoStack.length) { e.preventDefault(); undo(); }
    }
  });

  /* ============ 选中段落（严格限制在画布内） ============ */
  function selectionInCanvas() {
    const sel = window.getSelection();
    return !!sel.rangeCount && canvas.contains(sel.getRangeAt(0).commonAncestorContainer);
  }
  function selectedBlocks() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return [];
    const range = sel.getRangeAt(0);
    if (!canvas.contains(range.commonAncestorContainer)) return [];
    const blocks = [];
    const walker = document.createTreeWalker(canvas, NodeFilter.SHOW_ELEMENT, {
      acceptNode: n => BLOCK_TAGS.includes(n.tagName) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP
    });
    let n;
    while ((n = walker.nextNode())) {
      if (range.intersectsNode(n)) blocks.push(n);
    }
    // 只保留最内层块（不被其它已选中块包含的）：
    // 即使画布里残留了嵌套的 div 包装，也能精确选中光标所在的段落，
    // 而不是把整块外层容器一起选中。
    return blocks.filter(b => !blocks.some(o => o !== b && o.contains(b)));
  }
  function getTargetBlocks() { return activeBlocks; }
  function setBlockStyle(prop, val) {
    getTargetBlocks().forEach(b => { b.style[prop] = val; });
  }

  document.addEventListener('selectionchange', () => {
    const inCanvas = selectionInCanvas();
    if (inCanvas) {
      activeBlocks = selectedBlocks();
      const sel = window.getSelection();
      // 只要有画布内的文字选区，就持续同步 inlineRange，
      // 这样点击字号输入框等控件导致画布选区被浏览器收起/移走时，
      // 仍能记住刚才选中的文字，行内字号/颜色等操作不会丢选区。
      if (sel.rangeCount && !sel.isCollapsed && selectionInCanvas()) {
        inlineRange = sel.getRangeAt(0).cloneRange();
      }
      updateSelectionUI(true);
    } else {
      updateSelectionUI(false);
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.app-bar')) return; // 编辑栏（含清除格式/撤销/重做）与工具栏都不应清空选区
    if (e.target.closest('.col-side')) return; // 浮动样式面板整体（含存为模板、应用/删除模板按钮）都不应清空选区
    if (canvas.contains(e.target)) return;
    if (activeBlocks.length) { activeBlocks = []; updateSelectionUI(); }
  });

  function updateSelectionUI(refreshSliderValues = false) {
    const enabled = activeBlocks.length > 0;
    document.querySelectorAll('[data-gated]').forEach(el => { el.disabled = !enabled; });
    canvas.querySelectorAll('.current').forEach(el => el.classList.remove('current'));
    activeBlocks.forEach(b => b.classList.add('current'));
    setInlineToggleActive();
    if (refreshSliderValues) reflectSliders();
    const b0 = getTargetBlocks()[0];
    document.getElementById('indentBtn').classList.toggle('active', !!b0 && (parseFloat(getComputedStyle(b0).textIndent) || 0) > 0);
    document.getElementById('verticalBtn').classList.toggle('active', !!b0 && getComputedStyle(b0).writingMode.startsWith('vertical'));
  }

  /* ============ 行内格式：data-fid 扁平 run 模型（从 MVP 合并） ============
     说明：段落被归一化为扁平的 [文本 | span[data-fid]] 序列，span[data-fid] 内字体样式一致、不嵌套。
     - 加粗/斜体/下划线：开关式 toggleCmd（看所有选中 run 是否都已带该格式）
     - 字体颜色/字号/字体族/高亮：applyInlineStyle（写入单个属性，保留其它样式）
     - 清除字体格式：clearFontFormat（整段选满→删除整个 span；部分选中→切分，选中块成「新 fid + 空样式」） */

  let fidSeq = 0;
  function nextFid() { fidSeq++; return 'fid_' + Math.random().toString(36).slice(2, 6) + '_' + fidSeq.toString(36); }

  // —— 定位：选区是否跨段落（跨段落则不支持行内格式编辑，给出提示）——
  function getFontBlock(range) {
    var block = blockOf(range.commonAncestorContainer);
    if (!block) { alert('字体格式不支持跨段落编辑'); return null; }
    return block;
  }
  function blockOf(node) {
    var cur = (node && node.nodeType === 1) ? node : (node && node.parentElement);
    while (cur && cur !== canvas) {
      if (BLOCK_TAGS.indexOf(cur.tagName) !== -1) return cur;
      cur = cur.parentElement;
    }
    return null;
  }
  function nodeTextLen(node) {
    if (node.nodeType === Node.TEXT_NODE) return node.textContent.length;
    return (node.textContent || '').length;
  }
  // 边界点(container,offset)在 block 内的全局字符偏移
  function charOffsetInBlock(block, container, offset) {
    var r = document.createRange();
    try { r.setStart(block, 0); r.setEnd(container, offset); } catch (e) { return 0; }
    return r.toString().length;
  }
  // 按全局字符偏移在 block 的当前文本里重建 Range（normalize 重建 DOM 后用它恢复选区）
  function rangeBlock(block, startC, endC) {
    var walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    var n, acc = 0, sn = null, so = 0, en = null, eo = 0;
    while ((n = walker.nextNode())) {
      var len = n.textContent.length;
      if (sn === null && startC <= acc + len) { sn = n; so = startC - acc; }
      if (en === null && endC <= acc + len) { en = n; eo = endC - acc; }
      if (sn && en) break;
      acc += len;
    }
    if (!sn) { sn = block; so = 0; }
    if (!en) { en = block; eo = block.childNodes.length; }
    var r = document.createRange();
    try { r.setStart(sn, so); r.setEnd(en, eo); return r; } catch (e) { return null; }
  }
  // 该块是否含嵌套/裸格式标签（需要先拍平）
  function hasNesting(block) {
    return !!block.querySelector('span:not([data-fid]), b, i, u, s, strike, em, strong, font, span[data-fid] span');
  }
  function styleKey(style) {
    return Object.keys(style).sort().map(function (k) { return k + '=' + style[k]; }).join(';');
  }
  // 合并行内装饰 token：下划线/删除线都放在 text-decoration-line 上，可共存
  function addDecoToken(existing, add) {
    var set = {};
    String(existing || '').split(/\s+/).forEach(function (t) { if (t) set[t] = 1; });
    String(add || '').split(/\s+/).forEach(function (t) { if (t) set[t] = 1; });
    return Object.keys(set).join(' ');
  }

  // 把块内所有行内内容拍平成扁平 run：[文本 | span[data-fid]]，无嵌套
  function normalizeBlock(block) {
    var items = [];
    function walk(node, inherited) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (node.textContent) items.push({ t: 'text', text: node.textContent, inherit: inherited });
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        if (node.tagName === 'IMG' || node.tagName === 'BR') { items.push({ t: 'node', node: node }); return; }
        var own = {};
        var s = node.getAttribute('style');
        if (s) FONT_PROPS.forEach(function (p) { var v = node.style[p]; if (v) own[p] = v; });
        if (node.tagName === 'B' || node.tagName === 'STRONG') own.fontWeight = 'bold';
        if (node.tagName === 'I' || node.tagName === 'EM') own.fontStyle = 'italic';
        if (node.tagName === 'U') own.textDecorationLine = addDecoToken(own.textDecorationLine, 'underline');
        if (node.tagName === 'S' || node.tagName === 'STRIKE') own.textDecorationLine = addDecoToken(own.textDecorationLine, 'line-through');
        var merged = {};
        if (inherited) { for (var k in inherited) merged[k] = inherited[k]; }
        for (var k2 in own) {
          if (k2 === 'textDecorationLine') merged.textDecorationLine = addDecoToken(merged.textDecorationLine, own.textDecorationLine);
          else merged[k2] = own[k2];
        }
        for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i], merged);
      }
    }
    for (var i = 0; i < block.childNodes.length; i++) walk(block.childNodes[i], null);
    var merged = [];
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      if (it.t === 'node') { merged.push(it); continue; }
      var key = styleKey(it.inherit || {});
      var last = merged[merged.length - 1];
      if (last && last.t === 'text' && last.key === key) last.text += it.text;
      else { it.key = key; merged.push(it); }
    }
    block.textContent = '';
    for (var m = 0; m < merged.length; m++) {
      var e = merged[m];
      if (e.t === 'node') { block.appendChild(e.node); continue; }
      var styleSet = e.inherit || {};
      if (Object.keys(styleSet).length) {
        var sp = document.createElement('span');
        sp.setAttribute('data-fid', nextFid());
        for (var k3 in styleSet) sp.style[k3] = styleSet[k3];
        sp.textContent = e.text;
        block.appendChild(sp);
      } else {
        block.appendChild(document.createTextNode(e.text));
      }
    }
    if (!block.textContent && !block.querySelector('br,img')) block.innerHTML = '<br>';
  }
  function normalizeAll() {
    canvas.querySelectorAll(BLOCK_TAGS.join(',')).forEach(normalizeBlock);
  }

  // 在给定全局字符偏移处把 run 切开（让选区边界落在 run 边界上）
  function splitRunsAt(block, offsets) {
    var offs = offsets.slice().sort(function (a, b) { return a - b; });
    for (var o = 0; o < offs.length; o++) {
      var target = offs[o];
      if (target <= 0) continue;
      var acc = 0, split = false;
      for (var idx = 0; idx < block.childNodes.length; idx++) {
        var run = block.childNodes[idx];
        var len = nodeTextLen(run);
        if (target < acc + len) {
          var inRun = target - acc;
          if (run.nodeType === Node.TEXT_NODE) {
            if (inRun > 0 && inRun < len) run.splitText(inRun);
          } else if (run.nodeType === Node.ELEMENT_NODE && run.tagName === 'SPAN' && run.hasAttribute('data-fid')) {
            var tn = run.firstChild;
            if (tn && tn.nodeType === Node.TEXT_NODE && inRun > 0 && inRun < tn.textContent.length) {
              var after = tn.splitText(inRun);
              var right = run.cloneNode(false);
              right.setAttribute('data-fid', nextFid());
              right.appendChild(after);
              block.insertBefore(right, run.nextSibling);
            }
          }
          split = true;
          break;
        }
        acc += len;
      }
      if (!split) break;
    }
  }

  // 检查选区内【每一个】run 是否都已带该格式（且没有纯文本）
  function computeAllHave(block, startC, endC, prop) {
    var acc = 0, any = false;
    for (var i = 0; i < block.childNodes.length; i++) {
      var run = block.childNodes[i];
      var rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (!(rs < endC && re > startC)) continue;
      any = true;
      if (run.nodeType === Node.TEXT_NODE) return false;
      if (run.nodeType !== Node.ELEMENT_NODE || run.tagName !== 'SPAN' || !run.hasAttribute('data-fid')) return false;
      if (!run.style[prop]) return false;
    }
    return any;
  }

  // 检查选区内【每一个】run 是否都已带某个行内装饰 token（underline / line-through）
  function computeAllHaveToken(block, startC, endC, token) {
    var acc = 0, any = false;
    for (var i = 0; i < block.childNodes.length; i++) {
      var run = block.childNodes[i];
      var rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (!(rs < endC && re > startC)) continue;
      any = true;
      if (run.nodeType === Node.TEXT_NODE) return false;
      if (run.nodeType !== Node.ELEMENT_NODE || run.tagName !== 'SPAN' || !run.hasAttribute('data-fid')) return false;
      var deco = run.style.textDecorationLine || '';
      if (deco.split(/\s+/).indexOf(token) === -1) return false;
    }
    return any;
  }

  // 给选区里的【每个】run 写入某个属性（保留各自原有样式；纯文本→包新 span；空值→删除该属性）
  /* ---- 把一段内联 style 字符串规范化：去空格、按属性排序（用于比较两个 span 的样式是否一致）---- */
  function normalizeStyle(s) {
    var map = {};
    String(s || '').split(';').forEach(function (part) {
      var idx = part.indexOf(':');
      if (idx > -1) {
        var k = part.slice(0, idx).trim();
        var v = part.slice(idx + 1).trim();
        if (k) map[k] = v;
      }
    });
    return Object.keys(map).sort().map(function (k) { return k + ':' + map[k]; }).join(';');
  }

  /* ---- 相邻同样式合并优化（纯代码层面）：
       每次写入/改写/清除完一段 span 格式后调用。它检查邻近（左右相邻）的 run：
         · 两个相邻纯文本 → 合并成一个文本节点；
         · 两个相邻 span[data-fid] 且样式完全一致 → 合并成一个 span，把连续同格式的文字
           收敛成单个 span，避免「每写一个字就多一个 span」的碎片化。
       关键：合并后一定要 ① 给合并结果 a 换一个【新 fid】；② 用 a.normalize() 把吸收进来的
       相邻文本节点合并成一个——否则 a 会含有多个文本节点，而 splitRunsAt 里假定 span 只有
       一个 firstChild 文本节点，导致无法再拆分/写入/清除。
       合并不会改变文字内容与顺序，因此之后用字符偏移恢复选区依然准确。 ---- */
  function mergeAdjacentRuns(block) {
    var i = 0;
    while (i < block.childNodes.length - 1) {
      var a = block.childNodes[i];
      var b = block.childNodes[i + 1];
      if (a.nodeType === Node.TEXT_NODE && b.nodeType === Node.TEXT_NODE) {
        a.textContent += b.textContent;
        b.remove();
        continue;                                  // a 可能与下一个 b 再合并
      }
      if (a.nodeType === Node.ELEMENT_NODE && a.tagName === 'SPAN' && a.hasAttribute('data-fid') &&
          b.nodeType === Node.ELEMENT_NODE && b.tagName === 'SPAN' && b.hasAttribute('data-fid')) {
        var sa = a.getAttribute('style') || '';
        var sb = b.getAttribute('style') || '';
        // 只有两边都有非空样式且一致才合并（空白 span / 纯文本 span 不参与合并）
        if (sa && sb && normalizeStyle(sa) === normalizeStyle(sb)) {
          a.setAttribute('data-fid', nextFid());    // ① 合并后换新 fid
          while (b.firstChild) a.appendChild(b.firstChild);
          b.remove();
          a.normalize();                             // ② 把吸收进来的多个文本节点合并成一个文本节点
          continue;
        }
      }
      i++;
    }
  }

  function applyPropToSelection(range, prop, value) {
    if (!range) return;
    var block = getFontBlock(range);
    if (!block) return;
    if (hasNesting(block)) normalizeBlock(block);
    var startC = charOffsetInBlock(block, range.startContainer, range.startOffset);
    var endC = charOffsetInBlock(block, range.endContainer, range.endOffset);
    if (endC <= startC) return;
    splitRunsAt(block, [startC, endC]);
    var acc = 0;
    Array.from(block.childNodes).forEach(function (run) {
      var rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (!(rs >= startC && re <= endC)) return;
      if (run.nodeType === Node.TEXT_NODE) {
        if (value) {
          var sp = document.createElement('span');
          sp.setAttribute('data-fid', nextFid());
          sp.style[prop] = value;
          block.replaceChild(sp, run);
          sp.appendChild(run);
        }
      } else if (run.nodeType === Node.ELEMENT_NODE && run.tagName === 'SPAN' && run.hasAttribute('data-fid')) {
        var before = run.style[prop];
        run.style[prop] = value;
        if (run.style[prop] !== before) run.setAttribute('data-fid', nextFid());
        var any = FONT_PROPS.some(function (p) { return run.style[p]; });
        if (!any) { while (run.firstChild) block.insertBefore(run.firstChild, run); run.remove(); }
      }
    });
    // 相邻同样式合并：把新写入/改写的 span 与左右同格式的 span 合并成一个（并换新 fid + normalize）
    mergeAdjacentRuns(block);
    var newSel = rangeBlock(block, startC, endC);
    // 注意：这里不要 canvas.focus()——每次写入都抢回画布焦点会让滑块拖动时抖动；
    // 失焦期间“选中可见”由 showPersistentSelection（persist-sel 覆盖层）负责，
    // 这里只更新 window 选区（addRange），等用户点回画布时原生选区自然恢复。
    if (newSel) { inlineRange = newSel; var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(newSel); }
  }

  // —— 下划线/删除线按钮：在同一行装饰属性 text-decoration-line 里增删某一个 token（二者可共存）——
  function toggleDecoration(range, token) {
    if (!range) return false;
    var block = getFontBlock(range);
    if (!block) return false;
    if (hasNesting(block)) normalizeBlock(block);
    var startC = charOffsetInBlock(block, range.startContainer, range.startOffset);
    var endC = charOffsetInBlock(block, range.endContainer, range.endOffset);
    if (endC <= startC) return false;
    splitRunsAt(block, [startC, endC]);
    var allHave = computeAllHaveToken(block, startC, endC, token);
    var acc = 0;
    Array.from(block.childNodes).forEach(function (run) {
      var rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (!(rs >= startC && re <= endC)) return;
      if (run.nodeType === Node.TEXT_NODE) {
        var sp = document.createElement('span');
        sp.setAttribute('data-fid', nextFid());
        sp.style.textDecorationLine = token;
        block.replaceChild(sp, run);
        sp.appendChild(run);
      } else if (run.nodeType === Node.ELEMENT_NODE && run.tagName === 'SPAN' && run.hasAttribute('data-fid')) {
        var before = run.style.textDecorationLine || '';
        var tokens = before.split(/\s+/).filter(Boolean);
        var has = tokens.indexOf(token) !== -1;
        if (allHave) {
          if (has) tokens.splice(tokens.indexOf(token), 1);
        } else {
          if (!has) tokens.push(token);
        }
        run.style.textDecorationLine = tokens.join(' ');
        if (run.style.textDecorationLine !== before) run.setAttribute('data-fid', nextFid());
        var any = FONT_PROPS.some(function (p) { return run.style[p]; });
        if (!any) { while (run.firstChild) block.insertBefore(run.firstChild, run); run.remove(); }
      }
    });
    mergeAdjacentRuns(block);
    var newSel = rangeBlock(block, startC, endC);
    if (newSel) { inlineRange = newSel; var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(newSel); }
    return true;
  }

  // 找到完整包含整个选区的 span
  function findContainingSpan(block, startC, endC) {
    var acc = 0;
    for (var i = 0; i < block.childNodes.length; i++) {
      var run = block.childNodes[i];
      var rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (run.nodeType === Node.ELEMENT_NODE && run.tagName === 'SPAN' && run.hasAttribute('data-fid')) {
        if (rs <= startC && re >= endC) return run;
      }
    }
    return null;
  }

  // —— B/I/U 开关：所有选中 run 都已带该格式 → 删除每个；否则 → 全部写入 ——
  function toggleCmd(cmd) {
    if (!inlineRange) return false;
    var propMap = { bold: 'fontWeight', italic: 'fontStyle', underline: 'textDecorationLine', strike: 'textDecorationLine' };
    var valMap = { bold: 'bold', italic: 'italic', underline: 'underline', strike: 'line-through' };
    var prop = propMap[cmd];
    var block = getFontBlock(inlineRange);
    if (!block) return false;
    var startC = charOffsetInBlock(block, inlineRange.startContainer, inlineRange.startOffset);
    var endC = charOffsetInBlock(block, inlineRange.endContainer, inlineRange.endOffset);
    if (endC <= startC) { alert('先选中要加样式的文字'); return false; }
    // 下划线/删除线都落在 text-decoration-line 上，用 token 级增删，二者可共存
    if (cmd === 'underline' || cmd === 'strike') {
      return toggleDecoration(inlineRange, cmd === 'underline' ? 'underline' : 'line-through');
    }
    var allHave = computeAllHave(block, startC, endC, prop);
    applyPropToSelection(inlineRange, prop, allHave ? '' : valMap[cmd]);
    return true;
  }

  // B/I/U 按钮点亮状态：当前选中区是否由「一个带该格式的 span」完整覆盖
  function setInlineToggleActive() {
    var state = { fontWeight: false, fontStyle: false, underline: false, strike: false };
    if (inlineRange) {
      var block = blockOf(inlineRange.commonAncestorContainer);
      if (block) {
        var sc = charOffsetInBlock(block, inlineRange.startContainer, inlineRange.startOffset);
        var ec = charOffsetInBlock(block, inlineRange.endContainer, inlineRange.endOffset);
        if (ec > sc) {
          var span = findContainingSpan(block, sc, ec);
          if (span) {
            state.fontWeight = !!span.style.fontWeight;
            state.fontStyle = !!span.style.fontStyle;
            var decoTokens = (span.style.textDecorationLine || '').split(/\s+/).filter(Boolean);
            state.underline = decoTokens.indexOf('underline') !== -1;
            state.strike = decoTokens.indexOf('line-through') !== -1;
          }
        }
      }
    }
    document.querySelectorAll('[data-cmd]').forEach(function (btn) {
      var decoTok = { underline: 'underline', strike: 'line-through' }[btn.dataset.cmd];
      if (decoTok) { btn.classList.toggle('active', decoTok === 'underline' ? state.underline : state.strike); return; }
      var prop = { bold: 'fontWeight', italic: 'fontStyle' }[btn.dataset.cmd];
      if (prop) btn.classList.toggle('active', !!state[prop]);
    });
  }

  /* ============ 滑块控件（range + number 双向同步） ============ */
  // 行内样式：只作用于已捕获的选中文字（span 包裹），无选区则不做任何事
  function captureInlineRange() {
    const sel = window.getSelection();
    // 只在当前确实有新的、位于画布内的文字选区时更新；
    // 点击字号面板第二次、或点击确认按钮后若浏览器已经把选区移走，不能把之前保存的选区覆盖成 null。
    if (sel.rangeCount && !sel.isCollapsed && selectionInCanvas()) {
      inlineRange = sel.getRangeAt(0).cloneRange();
    }
  }

  /* —— 持续选区高亮：编辑器失焦（点字号/颜色等控件抢焦点）时，用真实 Range 画一层
         半透明高亮盖在选中文字上，让“调整格式期间”选区始终可见，避免“突然取消选中再恢复”。 —— */
  var persRects = [];
  var persActive = false;
  function showPersistentSelection() {
    hidePersistentSelection();
    if (!inlineRange) return;
    try {
      var rects = inlineRange.getClientRects();
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (!r.width && !r.height) continue;
        var el = document.createElement('div');
        el.className = 'persist-sel';
        el.style.left = r.left + 'px';
        el.style.top = r.top + 'px';
        el.style.width = r.width + 'px';
        el.style.height = r.height + 'px';
        document.body.appendChild(el);
        persRects.push(el);
      }
      persActive = persRects.length > 0;
    } catch (e) { persActive = false; }
  }
  function hidePersistentSelection() {
    (persRects || []).forEach(function (el) { el.remove(); });
    persRects = [];
    persActive = false;
  }
  // 只在失焦时画一次高亮，聚焦时撤掉；不做 scroll/resize 持续重算，
  // 否则会不停地 getClientRects 触发重排，导致滑块抖动。
  // —— 只有「点字号控件」这一次失焦才画“记住选区”的 persist-sel 覆盖层；
  //     其它任何失焦（点工具栏、点其它控件、点画布外空白/非段落位置）都不画，
  //     否则在竖排框里点空白处会莫名其妙冒出一个漂浮的蓝框。 ——
  var fontSizeInteract = false;
  ['fontSize', 'fontSizeNum'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    ['pointerdown', 'mousedown'].forEach(function (evt) {
      el.addEventListener(evt, function () { fontSizeInteract = true; });
    });
  });
  canvas.addEventListener('blur', function () {
    if (fontSizeInteract && inlineRange) showPersistentSelection();
    else hidePersistentSelection();
  });
  canvas.addEventListener('focus', function () { fontSizeInteract = false; hidePersistentSelection(); });
  // 凡是点击「字号控件」之外的地方（点其它控件、点画布、点空白），立刻撤掉覆盖层。
  document.addEventListener('mousedown', function (e) {
    var t = e.target;
    var isFontCtl = !!(t && t.closest && t.closest('#fontSize,#fontSizeNum'));
    if (isFontCtl) { fontSizeInteract = true; return; }
    fontSizeInteract = false;
    if (persActive) hidePersistentSelection();
  });

  // —— 一键回到页面顶端/底端：按钮固定钉在左下/右下角，滚动的是整个页面（window） ——
  var toTopBtn = document.getElementById('toTopBtn');
  var toBottomBtn = document.getElementById('toBottomBtn');
  if (toTopBtn) toTopBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  if (toBottomBtn) toBottomBtn.addEventListener('click', function () { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }); });

  // 写入单个行内属性（字体颜色/字号/字体族/高亮底色等）：走 id-model 扁平 run 模型。
  // 跨段落选区会由 getFontBlock 提示「字体格式不支持跨段落编辑」。

  function applyInlineStyle(prop, value) {
    if (!inlineRange) captureInlineRange();   // 点字号/颜色等控件会抢走焦点：先尝试再记一次选区
    if (!inlineRange) return false;
    applyPropToSelection(inlineRange, prop, value);
    return true;
  }

  // 字号滑块显示的基准值：优先看「当前选中的文字」的行内字号，其次才是段落字号。
  // （已删除“选中文字才回显字号”的 getInlineFontSize：它会读 getComputedStyle 触发重排，
  //   导致拖动字号滑块时抖动。现在字号滑块只由用户手动操作，不再按选中文字自动回写。）

  const fontSliders = [
    { label: '字号', id: 'fontSize', min: 1, max: 200, rangeMin: 8, rangeMax: 72, step: 1, value: 16, onStart: captureInlineRange,
      guardOverride: true, guardMessage: '已覆盖选中范围内的段落字号。',
      apply: v => applyInlineStyle('fontSize', v + 'px'),
      reflect: () => null },   // 不自动回显“选中文字的字号”，避免拖动滑块时读取字号触发重排抖动
  ];
  const paraSliders = [
    { label: '字号', id: 'paraFontSize', min: 1, max: 200, rangeMin: 8, rangeMax: 72, step: 1, value: 16,
      apply: v => setBlockStyle('fontSize', v + 'px'),
      reflect: b => Math.round(parseFloat(getComputedStyle(b).fontSize)) },
    { label: '字距', id: 'paraLetterSpacing', min: -2, max: 50, step: 0.5, value: 0,
      apply: v => setBlockStyle('letterSpacing', v + 'px'),
      reflect: b => parseFloat(getComputedStyle(b).letterSpacing) || 0 },
    { label: '行距', id: 'lineHeight', min: 1, max: 10, step: 0.1, value: 1.8,
      apply: v => setBlockStyle('lineHeight', v),
      reflect: b => { const cs = getComputedStyle(b); const fs = parseFloat(cs.fontSize); return fs ? Math.round((parseFloat(cs.lineHeight) / fs) * 10) / 10 : 1.8; } },
    { label: '段前', id: 'marginTop', min: 0, max: 150, step: 1, value: 0,
      apply: v => setBlockStyle('marginTop', v + 'px'),
      reflect: b => Math.max(0, parseFloat(getComputedStyle(b).marginTop) || 0) },
    { label: '段后', id: 'marginBottom', min: 0, max: 150, step: 1, value: 14,
      apply: v => setBlockStyle('marginBottom', v + 'px'),
      reflect: b => Math.max(0, parseFloat(getComputedStyle(b).marginBottom) || 0) },
  ];
  const canvasSliders = [
    { label: '宽', id: 'canvasWidth', min: 50, max: 1200, step: 10, value: 640,
      apply: v => { canvas.style.width = v + 'px'; } },
    { label: '左距', id: 'padLeft', min: 0, max: 160, step: 2, value: 70, linkGroup: 'horizontalMargin',
      apply: v => { canvas.style.paddingLeft = v + 'px'; } },
    { label: '右距', id: 'padRight', min: 0, max: 160, step: 2, value: 70, linkGroup: 'horizontalMargin',
      apply: v => { canvas.style.paddingRight = v + 'px'; } },
    { label: '上边距', id: 'padTop', min: 0, max: 200, step: 2, value: 50, linkGroup: 'verticalMargin',
      apply: v => { canvas.style.paddingTop = v + 'px'; } },
    { label: '下边距', id: 'padBottom', min: 0, max: 160, step: 2, value: 50, linkGroup: 'verticalMargin',
      apply: v => { canvas.style.paddingBottom = v + 'px'; } },
  ];

  const sliderLinkState = { horizontalMargin: true, verticalMargin: true };
  function buildSlider(container, cfg, gated) {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    const rangeMin = cfg.rangeMin ?? cfg.min;
    const rangeMax = cfg.rangeMax ?? cfg.max;

    let controlHtml = '';
    if (cfg.separateNumber) {
      controlHtml = `
        <span class="ctl-range-value" id="${cfg.id}RangeValue" aria-label="${cfg.label}滑块当前值">${cfg.value}</span>
        <select class="size-picker-select" title="字号精确调整" aria-label="${cfg.label}调整入口">
          <option value="">字号调整</option>
          <option value="custom">自定义</option>
        </select>
        <span class="size-custom-inline" hidden>
          <input type="number" class="size-custom-input" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" placeholder="自定义" aria-label="${cfg.label}自定义字号">
          <span class="size-unit">x</span>
          <button type="button" class="size-apply">应用</button>
        </span>`;
    } else {
      controlHtml = `<input type="number" id="${cfg.id}Num" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.value}">`;
    }

    wrap.innerHTML = `<label>${cfg.label}</label>${cfg.linkGroup ? `<button class="ctl-link" type="button" title="${cfg.linkGroup === 'horizontalMargin' ? '锁定左右距同步' : '锁定上下距同步'}">🔗</button>` : ''}
      <input type="range" id="${cfg.id}" min="${rangeMin}" max="${rangeMax}" step="${cfg.step}" value="${cfg.value}">${controlHtml}`;
    container.appendChild(wrap);

    const range = wrap.querySelector('input[type="range"]');
    const num = wrap.querySelector('input[type="number"]');
    const linkBtn = wrap.querySelector('.ctl-link');
    const rangeValueEl = wrap.querySelector('.ctl-range-value');
    const sizePicker = wrap.querySelector('.size-picker-select');
    const sizeCustomInline = wrap.querySelector('.size-custom-inline');
    const sizeCustomInput = wrap.querySelector('.size-custom-input');
    const sizeApply = wrap.querySelector('.size-apply');
    if (gated) range.dataset.gated = '1';
    if (gated && num) num.dataset.gated = '1';

    const applyRange = () => cfg.apply(range.value);
    const startInteraction = () => { snapshot(); if (cfg.onStart) cfg.onStart(); };
    if (gated) {
      range.addEventListener('pointerdown', startInteraction);
      if (num) {
        // 以后编辑栏“字体”区域新增任何滑块/数值输入时，都必须在控件抢走焦点前记住刚刚选中的文字，
        // 否则点击数字输入框会先触发 selectionchange，导致行内字号等操作丢失原本的选区。
        num.addEventListener('pointerdown', () => { if (cfg.onStart) captureInlineRange(); });
        num.addEventListener('mousedown', () => { if (cfg.onStart) captureInlineRange(); });
        // focus 只捕获选区，不 snapshot；snapshot 在 change 时触发
        num.addEventListener('focus', () => { if (cfg.onStart) captureInlineRange(); });
      }
      if (sizePicker) sizePicker.addEventListener('pointerdown', () => { if (cfg.onStart) captureInlineRange(); });
      if (sizeCustomInput) {
        sizeCustomInput.addEventListener('pointerdown', () => { if (cfg.onStart) captureInlineRange(); });
        sizeCustomInput.addEventListener('mousedown', () => { if (cfg.onStart) captureInlineRange(); });
      }
    }

    function validNumber(raw) {
      const v = Number(raw);
      return raw !== '' && Number.isFinite(v) && v >= cfg.min && v <= cfg.max &&
        Math.abs((v - cfg.min) / cfg.step - Math.round((v - cfg.min) / cfg.step)) < 1e-8;
    }

    function commitSize(value, showError = true) {
      const raw = String(value).trim();
      if (!validNumber(raw)) {
        if (showError) alert(`${cfg.label}请输入 ${cfg.min}～${cfg.max} 之间的有效数值。`);
        return false;
      }
      if (gated) snapshot();
      cfg.apply(raw);
      if (cfg.guardOverride) notifyOverride(cfg.guardMessage);
      if (sizeCustomInput) sizeCustomInput.value = '';
      if (sizeCustomInline) sizeCustomInline.hidden = true;
      if (sizePicker) sizePicker.value = "";
      return true;
    }

    range.addEventListener('input', () => {
      if (rangeValueEl) rangeValueEl.textContent = range.value;
      if (num && !cfg.separateNumber) num.value = range.value;
      applyRange();
      if (cfg.linkGroup && sliderLinkState[cfg.linkGroup]) syncLinkedMargin(cfg.id, Number(range.value));
    });

    if (num) {
      let lastCommitted = String(cfg.value);
      const commitNumber = () => {
        const raw = String(num.value).trim();
        if (!validNumber(raw)) { num.value = lastCommitted; alert(`${cfg.label}请输入 ${cfg.min}～${cfg.max} 之间的有效数值。`); return; }
        // 值未变化就直接跳过：否则数字框里回车提交（commitNumber）后又 blur 触发一次 change，
        // 会把同一改动应用两次、提示弹窗弹两次。
        if (raw === lastCommitted) return;
        if (gated) snapshot();
        lastCommitted = raw;
        range.value = Math.max(Number(range.min), Math.min(Number(range.max), Number(raw)));
        cfg.apply(raw);
        if (cfg.guardOverride) notifyOverride(cfg.guardMessage);
        if (cfg.linkGroup && sliderLinkState[cfg.linkGroup]) syncLinkedMargin(cfg.id, Number(raw));
      };
      num.addEventListener('change', commitNumber);
      num.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitNumber(); num.blur(); } });
    }

    if (cfg.separateNumber) {
      sizePicker.addEventListener('change', e => {
        // 原生 select 与“字体”控件走同样的浏览器交互路径，不创建浮层，因此不会把编辑器文字选区视觉上盖掉。
        if (e.target.value === 'custom') {
          if (cfg.onStart) captureInlineRange();
          sizeCustomInline.hidden = false;
          sizeCustomInput.focus();
        } else {
          sizeCustomInline.hidden = true;
        }
      });
      sizeApply.addEventListener('click', e => {
        e.preventDefault();
        // 使用已经保存的 inlineRange；这里绝不再次从当前 selection 覆盖它。
        const raw = String(sizeCustomInput.value || '').trim();
        if (!validNumber(raw)) { alert(`${cfg.label}请输入 ${cfg.min}～${cfg.max} 之间的有效数值。`); return; }
        commitSize(raw, true);
      });
      sizeCustomInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); sizeApply.click(); }
      });
    }

    if (linkBtn) {
      const group = cfg.linkGroup;
      const updateLinkButton = () => {
        const locked = sliderLinkState[group];
        linkBtn.textContent = locked ? '🔗' : '🔓';
        linkBtn.title = locked ? (group === 'horizontalMargin' ? '左右距已链接，点击解锁' : '上下距已链接，点击解锁') : (group === 'horizontalMargin' ? '左右距已解锁，点击重新链接' : '上下距已解锁，点击重新链接');
        linkBtn.classList.toggle('unlinked', !locked);
      };
      linkBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        sliderLinkState[group] = !sliderLinkState[group];
        updateLinkButton();
        if (sliderLinkState[group]) {
          const pair = group === 'horizontalMargin' ? ['padLeft', 'padRight'] : ['padTop', 'padBottom'];
          const source = cfg.id;
          const sourceCfg = [...canvasSliders].find(x => x.id === source);
          const v = (sourceCfg._num && sourceCfg._num.value !== undefined)
            ? Number(sourceCfg._num.value)
            : Number(sourceCfg._range.value);
          syncLinkedMargin(source, v);
        }
      });
      updateLinkButton();
    }

    applyRange();
    if (rangeValueEl) rangeValueEl.textContent = range.value;
    cfg._range = range;
    cfg._num = num;
    cfg._rangeValue = rangeValueEl;
    cfg._sizePicker = sizePicker;
    cfg._sizeCustomInput = sizeCustomInput;
  }
  function syncLinkedMargin(sourceId, value) {
    const group = sourceId === 'padLeft' || sourceId === 'padRight' ? 'horizontalMargin' : 'verticalMargin';
    const pair = group === 'horizontalMargin' ? ['padLeft', 'padRight'] : ['padTop', 'padBottom'];
    const targetId = pair.find(id => id !== sourceId);
    const targetCfg = canvasSliders.find(x => x.id === targetId);
    if (!targetCfg) return;
    const clamped = Math.max(Number(targetCfg.min), Math.min(Number(targetCfg.max), value));
    targetCfg._num.value = clamped;
    targetCfg._range.value = Math.max(Number(targetCfg._range.min), Math.min(Number(targetCfg._range.max), clamped));
    targetCfg.apply(clamped);
  }
  paraSliders.forEach(c => buildSlider(document.getElementById('paraSliders'), c, true));
  fontSliders.forEach(c => buildSlider(document.getElementById('fontSliders'), c, true));
  canvasSliders.forEach(c => buildSlider(document.getElementById('canvasSliders'), c, false));

  function reflectSliders() {
    const b = getTargetBlocks()[0];
    if (!b) return;
    [...paraSliders, ...fontSliders].forEach(cfg => {
      // 正在被用户操作的滑块不要回写、也不要读它的 reflect（否则拖动时读字号触发重排 → 抖动）
      if (cfg._range && cfg._range === document.activeElement) return;
      if (cfg._num && cfg._num === document.activeElement) return;
      const v = cfg.reflect(b);
      if (v === null || v === undefined || Number.isNaN(Number(v))) return;
      if (!cfg._range) return;
      const num = Number(v);
      cfg._range.value = Math.max(Number(cfg._range.min), Math.min(Number(cfg._range.max), num));
      // 同步数字输入框：选中不同文字/段落后，精确调整入口直接显示当前字号。
      // 正在编辑的那个输入框不要覆盖，避免抢走用户正在输入的值。
      if (cfg._num && cfg._num !== document.activeElement) cfg._num.value = String(Math.round(num * 100) / 100);
      if (cfg._rangeValue) cfg._rangeValue.textContent = String(num);
    });
  }
  /* ============ 字体 / 对齐 / B I U ============ */
  function resetSel(sel) { sel.value = ''; }
  // 竖排时，左右/中对齐要靠“收窄段落宽度 + auto margin”实现；普通 text-align
  // 只作用于竖排的行内轴，不能把整列文字真正推到画布左/中/右。
  function applyParagraphAlignment(b) {
    const cs = getComputedStyle(b);
    const vertical = cs.writingMode.startsWith('vertical');
    if (!vertical) {
      // 横排下，段落宽度交给父容器（撑满画布），不做显式收窄；
      // 左/中/右对齐只用 text-align 控制文字在段落盒子内的排布。
      b.style.width = '';
      b.style.marginLeft = '';
      b.style.marginRight = '';
      return;
    }
    const align = cs.textAlign;
    b.style.width = 'fit-content';
    if (align === 'right') {
      b.style.marginLeft = 'auto';
      b.style.marginRight = '0';
    } else if (align === 'center') {
      b.style.marginLeft = 'auto';
      b.style.marginRight = 'auto';
    } else {
      b.style.marginLeft = '0';
      b.style.marginRight = 'auto';
    }
  }
  /* ==== 字体：从 font/fonts.json 动态发现，用 FontFace API 加载；进页即开始下载，不再等点字体。 ==== */
  let FONT_MANIFEST = [];
  let bootOverlay = null, bootHint = null;
  function showBoot(show, hintText) {
    if (!bootOverlay) { bootOverlay = document.getElementById('bootOverlay'); bootHint = document.getElementById('bootHint'); }
    if (bootOverlay) bootOverlay.classList.toggle('hidden', !show);
    if (bootHint && hintText) bootHint.textContent = hintText;
  }
  function showToast(msg, ms) {
    const t = document.getElementById('bootToast'); if (!t) return;
    t.textContent = msg; t.hidden = false;
    if (ms) setTimeout(() => { t.hidden = true; }, ms);
  }
  function guessFormat(file) {
    const m = /\.(woff2|woff|ttf|otf)$/i.exec(file || ''); return m ? m[1] : 'truetype';
  }
  // 用 FontFace 加载清单里的全部字体（进页下载），返回失败列表
  function loadFontsFromManifest(manifest) {
    const failures = [];
    const tasks = manifest.map(f => {
      // 依次尝试：清单里的原 URL → 同文件名的 .woff2 兜底。
      // （防止清单里 file/format 过期、指到已被删除的 .ttf/.otf 时整批字体一加载就失败）
      const candidates = [];
      candidates.push([f.file, f.format || guessFormat(f.file)]);
      if (guessFormat(f.file) !== 'woff2') {
        candidates.push([f.file.replace(/\.(ttf|otf|woff)$/i, '.woff2'), 'woff2']);
      }
      let chain = Promise.reject();
      candidates.forEach(function (c) {
        chain = chain.catch(function () {
          try {
            // 支持同一 family 的多个字重（如思源黑体 常规/粗体）：传递给 FontFace 的 weight
            // 让 CSS font-weight:bold（700）能命中真实的粗体文件，而不是浏览器合成加粗。
            const desc = { display: 'swap' };
            if (f.weight) desc.weight = f.weight;
            const face = new FontFace(f.family, "url('font/" + c[0] + "') format('" + c[1] + "')", desc);
            return face.load().then(() => { document.fonts.add(face); });
          } catch (e) { return Promise.reject(e); }
        });
      });
      return chain.catch(() => { failures.push(f.label || f.family); });
    });
    return Promise.all(tasks).then(() => failures);
  }
  // 由 fonts.json 生成两个字体下拉（段落/行内），选项用该字体的样式展示
  function buildFontSelects(manifest) {
    ['paraFontFamily', 'inlineFontFamily'].forEach(id => {
      const sel = document.getElementById(id); if (!sel) return;
      sel.innerHTML = '';
      const ph = document.createElement('option'); ph.value = ''; ph.hidden = true; ph.textContent = '字体';
      sel.appendChild(ph);
      const seen = new Set();
      manifest.forEach(f => {
        // 同一 family（如思源黑体 常规+粗体）在下拉里只显示一次，字重交给“加粗”按钮切换。
        // 加载阶段（loadFontsFromManifest）仍会为每个字重分别注册 FontFace，所以不影响加粗命中真实粗体。
        if (seen.has(f.family)) return;
        seen.add(f.family);
        const stack = "'" + f.family + "'," + (f.fallback || 'sans-serif');
        const o = document.createElement('option');
        o.value = stack;                       // 应用到文字上的 font-family
        o.textContent = f.label || f.family;   // 下拉显示名
        o.style.fontFamily = stack;            // 用该字体样式展示
        sel.appendChild(o);
      });
    });
  }

  document.getElementById('paraFontFamily').addEventListener('change', e => { snapshot(); setBlockStyle('fontFamily', e.target.value); resetSel(e.target); });
  document.getElementById('inlineFontFamily').addEventListener('pointerdown', captureInlineRange);
  document.getElementById('inlineFontFamily').addEventListener('change', e => {
    snapshot();
    applyInlineStyle('fontFamily', e.target.value);
    resetSel(e.target);
    // 字体替换同样会覆盖段落级字体；必须等原生选择器彻底结束后再提示，
    // 避免网页仍处于下拉选择状态时弹窗抢走交互。
    setTimeout(() => notifyOverride('已覆盖选中范围内的段落字体。'), 0);
  });
  // 加粗/斜体/下划线：走 id-model 的开关逻辑（所有选中 run 都已带该格式→删除每个；否则→全部写入）
  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.cmd;
      const propMap = { bold: 'fontWeight', italic: 'fontStyle', underline: 'textDecorationLine', strike: 'textDecorationLine' };
      if (propMap[cmd]) {
        captureInlineRange();
        if (!inlineRange) return;
        snapshot();
        if (toggleCmd(cmd)) updateSelectionUI();
      } else {
        snapshot();
        canvas.focus();
        document.execCommand(cmd, false, null);
        updateSelectionUI();
      }
    });
  });
  document.querySelectorAll('[data-align]').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      snapshot();
      setBlockStyle('textAlign', btn.dataset.align);
      getTargetBlocks().forEach(applyParagraphAlignment);
    });
  });
  document.getElementById('indentBtn').addEventListener('mousedown', e => e.preventDefault());
  document.getElementById('indentBtn').addEventListener('click', () => {
    const blocks = getTargetBlocks();
    if (!blocks.length) return;
    snapshot();
    const anyIndent = blocks.some(b => (parseFloat(getComputedStyle(b).textIndent) || 0) > 0);
    blocks.forEach(b => { b.style.textIndent = anyIndent ? '' : '2em'; });
    updateSelectionUI();
  });
  document.getElementById('verticalBtn').addEventListener('mousedown', e => e.preventDefault());
  document.getElementById('verticalBtn').addEventListener('click', () => {
    const blocks = getTargetBlocks();
    if (!blocks.length) return;
    snapshot();
    const anyVertical = blocks.some(b => getComputedStyle(b).writingMode.startsWith('vertical'));
    blocks.forEach(b => {
      if (anyVertical) { b.style.writingMode = ''; b.style.textOrientation = ''; }
      else { b.style.writingMode = 'vertical-rl'; b.style.textOrientation = 'upright'; }
      applyParagraphAlignment(b);
    });
    updateSelectionUI();
  });

  /* ============ 色板 ============ */
  // 通用色板：字体颜色、段落文字色、高亮底色、画布背景共用。
  const my_PRESETS = [
    { name: '纯黑', value: '#000000' },
    { name: '墨黑', value: '#222222' },
    { name: '深灰', value: '#343434' },
    { name: '石墨灰', value: '#505050' },
    { name: '橄榄灰', value: '#5A5A50' },

    { name: '暖灰', value: '#BEB9B3' },
    { name: '银灰', value: '#B9B9B9' },
    { name: '浅灰', value: '#D8D8D8' },
    { name: '雾紫灰', value: '#CFCFD4' },
    { name: '浅白', value: '#E5E5E5' },
    { name: '暖白', value: '#EBEAE5' },
    { name: '冷白', value: '#F8FFFF' },
    { name: '纯白', value: '#FFFFFF' },

    { name: '午夜蓝', value: '#0A2F92' },
    { name: '深海蓝', value: '#004681' },
    { name: '蓝灰', value: '#8796A9' },

    { name: '深灰绿', value: '#1E4252' },
    { name: '鼠尾草绿', value: '#567063' },
    { name: '灰绿', value: '#B9C3BA' },

    { name: '薰衣草灰', value: '#B2B8D0' },
    { name: '灰粉', value: '#B39FAF' },
    { name: '酒红', value: '#6B2122' },
    { name: '褐灰', value: '#3B392D' },
    { name: '沙金', value: '#DBBC8F' },
  ];
  // 字体颜色、段落文字色、高亮底色、画布背景：共用通用色板
  const TEXT_COLORS = my_PRESETS;
  const BG_PRESETS = my_PRESETS;

  /* 通用取色控件：按钮 + 弹层（色板 + 取色器 + hex）。每个取色器独立保存自己的色板，
     自定义色可删除，重新打开页面仍会保留；预设色同样可以删除。 */
  function buildColorControl(container, opts) {
    const group = document.createElement('div');
    group.className = 'color-group';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'color-btn';
    if (opts.gated) btn.setAttribute('data-gated', '1');
    btn.title = opts.title;
    const dot = document.createElement('span');
    dot.className = 'swatch-current';
    dot.style.background = opts.defaultColor || 'var(--text)';
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(opts.label));

    const pop = document.createElement('div');
    pop.className = 'color-pop';
    const grid = document.createElement('div');
    grid.className = 'swatch-grid';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'swatch swatch-add';
    addBtn.title = '把当前颜色加入色板';
    addBtn.textContent = '+';
    addBtn.addEventListener('mousedown', e => e.preventDefault());
    grid.appendChild(addBtn);

    const paletteKey = 'longimage-palette-' + (opts.id || opts.label);
    // 始终以内置色板（新版通用色板）为准，再合并用户历史自定义色；
    // 避免历史 localStorage 里被清空的 [] 或旧色板把新色板顶掉（如画布背景/段落色）。
    const builtins = Array.isArray(opts.palette) ? opts.palette : [];
    let palette = builtins.slice();
    try {
      const saved = JSON.parse(localStorage.getItem(paletteKey) || 'null');
      if (Array.isArray(saved)) {
        saved.forEach(it => {
          if (it && it.value && !palette.some(x => x.value === it.value)) palette.push(it);
        });
      }
    } catch (e) {}

    function persistPalette() {
      try { localStorage.setItem(paletteKey, JSON.stringify(palette)); } catch (e) {}
    }
    function normalizeHex(v) {
      v = String(v || '').trim();
      if (v && v[0] !== '#') v = '#' + v;
      return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toUpperCase() : null;
    }
    function addSwatch(colorValue, name) {
      const item = document.createElement('div');
      item.className = 'swatch-item';
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'swatch';
      s.title = name || colorValue;
      s.style.background = colorValue;
      s.addEventListener('mousedown', e => e.preventDefault());
      s.addEventListener('click', () => apply(colorValue));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'swatch-delete';
      del.title = '删除这个颜色';
      del.textContent = '×';
      del.addEventListener('mousedown', e => e.preventDefault());
      del.addEventListener('click', e => {
        e.stopPropagation();
        showModal(`确定要删除色板中的“${colorValue}”吗？`, [
          { text: '取消' },
          { text: '删除', primary: true, onClick: () => {
            palette = palette.filter(x => x.value !== colorValue);
            item.remove();
            persistPalette();
          } }
        ]);
      });
      item.append(s, del);
      grid.insertBefore(item, addBtn);
      return item;
    }
    palette.forEach(it => addSwatch(it.value, it.name));
    pop.appendChild(grid);

    const customRow = document.createElement('div');
    customRow.className = 'pop-custom';
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = opts.defaultColor || '#000000';
    const hexInput = document.createElement('input');
    hexInput.type = 'text';
    hexInput.className = 'hex-input';
    hexInput.placeholder = '#RRGGBB';
    hexInput.maxLength = 7;
    hexInput.value = opts.defaultColor || '#000000';
    const hexApplyBtn = document.createElement('button');
    hexApplyBtn.type = 'button';
    hexApplyBtn.className = 'hex-apply-btn';
    hexApplyBtn.textContent = '应用';
    customRow.append(colorInput, hexInput, hexApplyBtn);
    pop.appendChild(customRow);
    group.append(btn, pop);
    container.appendChild(group);

    function setFromHex(hex) {
      colorInput.value = hex;
      hexInput.value = hex;
    }
    function apply(color) {
      dot.style.background = color || 'var(--text)';
      if (opts.onApply) opts.onApply(color);
      pop.classList.remove('open');
    }
    function normalizeAndApplyHex() {
      const v = normalizeHex(hexInput.value);
      if (!v) return null;
      setFromHex(v);
      apply(v);
      return v;
    }

    colorInput.addEventListener('input', () => setFromHex(colorInput.value));
    colorInput.addEventListener('change', () => apply(colorInput.value));
    hexInput.addEventListener('change', normalizeAndApplyHex);
    hexApplyBtn.addEventListener('mousedown', e => e.preventDefault());
    hexApplyBtn.addEventListener('click', normalizeAndApplyHex);
    addBtn.addEventListener('click', () => {
      const v = normalizeHex(hexInput.value);
      if (!v || palette.some(x => x.value === v)) return;
      palette.push({ name: v, value: v });
      addSwatch(v, v);
      persistPalette();
    });

    btn.addEventListener('mousedown', e => { e.preventDefault(); if (opts.onCapture) opts.onCapture(); });
    btn.addEventListener('click', () => {
      document.querySelectorAll('.color-pop.open').forEach(p => { if (p !== pop) p.classList.remove('open'); });
      pop.classList.toggle('open');
    });
    document.addEventListener('mousedown', e => {
      if (!group.contains(e.target)) pop.classList.remove('open');
    });
  }

  /* 通用弹窗 */
  function showModal(message, buttons) {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    const dlg = document.createElement('div');
    dlg.className = 'modal';
    const msg = document.createElement('p');
    msg.className = 'modal-msg';
    msg.textContent = message;
    dlg.appendChild(msg);
    const row = document.createElement('div');
    row.className = 'modal-btns';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'modal-btn' + (b.primary ? ' primary' : '');
      btn.textContent = b.text;
      btn.addEventListener('click', () => { ov.remove(); b.onClick(); });
      row.appendChild(btn);
    });
    dlg.appendChild(row);
    ov.appendChild(dlg);
    document.body.appendChild(ov);
  }

  /* ============ 行内覆盖提示（字体颜色 + 字号 共用） ============
   * 行内“字体颜色”“字号”会盖住段落级的文字色/字号设置。这两个操作
   * 现在都是先立即生效，生效之后再弹一次提示（不再阻断操作本身，
   * 也不再有 3 秒缓冲）。点“忽略（不再提示）”会记入 localStorage，
   * 之后不再弹；这个“是否忽略”的开关和下面的自动保存草稿是两码事，
   * 不会被写进草稿数据里，也不会随草稿一起导出/清空。 */
  let overrideWarnIgnored = false;
  try { overrideWarnIgnored = localStorage.getItem('override-warn-ignored') === '1'; } catch (e) {}
  function notifyOverride(message) {
    if (overrideWarnIgnored) return;
    showModal(message, [
      { text: '继续', primary: true, onClick: () => {} },
      { text: '忽略（不再提示）', onClick: () => { overrideWarnIgnored = true; try { localStorage.setItem('override-warn-ignored', '1'); } catch (e) {} } },
    ]);
  }
  function applyInlineColor(color) {
    if (!inlineRange) return;
    snapshot();
    applyInlineStyle('color', color);   // id-model：写入颜色属性，保留其它样式
  }
  function applyInlineColorGuarded(color) {
    applyInlineColor(color);
    notifyOverride('已覆盖选中范围内的段落文字色。');
  }

  // 段落内如果有行内“字体颜色” span，它自己的 color 会盖住段落色，
  // 导致改整段文字色时视觉上“不生效”。这里清掉这类行内颜色覆盖
  // （只动 color，不碰同一个 span 上可能存在的背景高亮/字号等其它样式）。
  function clearBlockColorOverrides(b) {
    b.querySelectorAll('*').forEach(el => {
      if (el.style && el.style.color) {
        el.style.removeProperty('color');
        if (['SPAN', 'FONT'].includes(el.tagName) && !el.getAttribute('style')) {
          const parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          parent.removeChild(el);
        }
      }
    });
    // 二次清理：解包所有无属性、无 class 的 span/font，避免残留空包装
    b.querySelectorAll('span, font').forEach(el => {
      if (!el.getAttribute('style') && !el.className) {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }
    });
  }

  // ① 整段文字色（段落文字色）
  buildColorControl(document.getElementById('paraTextColorControls'), {
    id: 'textColor', label: '段落文字色', title: '整段文字颜色', gated: true,
    palette: TEXT_COLORS, defaultColor: '#FBFBFB',
    onCapture: () => { pendingBlocks = getTargetBlocks(); },
    onApply: (color) => {
      if (!pendingBlocks.length) return;
      snapshot();
      pendingBlocks.forEach(b => { b.style.color = color; clearBlockColorOverrides(b); });
    }
  });

  // ② 字体颜色（行内文字片段色）
  buildColorControl(document.getElementById('fontColorControls'), {
    id: 'inlineColor', label: '字体颜色', title: '选中文字片段颜色', gated: true,
    palette: TEXT_COLORS, defaultColor: '#FBFBFB',
    onCapture: () => {
      const sel = window.getSelection();
      if (sel.rangeCount && !sel.isCollapsed && selectionInCanvas()) {
        inlineRange = sel.getRangeAt(0).cloneRange();
      }
    },
    onApply: (color) => applyInlineColorGuarded(color)
  });

  // ⑤ 画布背景
  buildColorControl(document.getElementById('canvasColorControls'), {
    id: 'bg', label: '背景', title: '背景颜色', gated: false,
    palette: BG_PRESETS, defaultColor: '#1B1B1C',
    onApply: (color) => { canvas.style.background = color; syncPreviewBg(); }
  });

  /* ============ 粘贴清洗 ============
   * 关键：把剪贴板 HTML 拍平成“body 下直接是块级元素”的干净结构。
   * 从 Claude / 微信等复制出来的 HTML 往往是多层 <div> 套 <p>，
   * 甚至整段只有 <span>/<br> 没有块级元素。若不拍平，粘贴后：
   *   1) 段落检测（selectedBlocks）找不到可选中块 → 工具栏一直禁用；
   *   2) 即便检测到，也只能选中整块外层容器，无法按段应用样式。
   * 拍平后每个段落都是独立的 <p>，可直接选中、单独设置样式。 */
  function sanitizePaste(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('*').forEach(n => {
      n.removeAttribute('style');
      n.removeAttribute('color');
      n.removeAttribute('face');
      n.removeAttribute('bgcolor');
      n.removeAttribute('class');
    });
    doc.querySelectorAll('font').forEach(f => f.replaceWith(...Array.from(f.childNodes)));

    const BLOCK = new Set(BLOCK_TAGS);
    // 递归拆 div：div 里只有行内内容 → 转成 <p>；div 里还有块级子元素 → 拆掉这层 div 只留子元素
    // 注意：先收集再批量替换，避免修改正在迭代的 children 集合导致元素被跳过
    function flattenDivs(root) {
      const toReplace = [];
      Array.from(root.children).forEach(child => {
        flattenDivs(child);
        if (child.tagName === 'DIV') {
          const kids = Array.from(child.childNodes);
          const hasBlockKid = kids.some(k => k.nodeType === 1 && BLOCK.has(k.tagName));
          if (hasBlockKid) {
            toReplace.push({ old: child, newNodes: kids });
          } else {
            const p = doc.createElement('p');
            while (child.firstChild) p.appendChild(child.firstChild);
            toReplace.push({ old: child, newNodes: [p] });
          }
        }
      });
      toReplace.forEach(({ old, newNodes }) => old.replaceWith(...newNodes));
    }
    flattenDivs(doc.body);

    // 迭代收尾：body 的直接子节点必须都是块级元素。
    // 裸文本 / <span> 等行内包装 → 包进 <p>；纯空白节点 → 删掉。
    let dirty = true;
    while (dirty) {
      dirty = false;
      Array.from(doc.body.childNodes).forEach(n => {
        if (n.nodeType === 3) {
          if (n.textContent.trim()) {
            const p = doc.createElement('p');
            p.textContent = n.textContent;
            doc.body.replaceChild(p, n);
            dirty = true;
          } else {
            n.remove();
            dirty = true;
          }
        } else if (n.nodeType === 1 && !BLOCK.has(n.tagName)) {
          const kids = Array.from(n.childNodes);
          const hasBlockKid = kids.some(k => k.nodeType === 1 && BLOCK.has(k.tagName));
          if (hasBlockKid) {
            n.replaceWith(...kids);
          } else {
            const p = doc.createElement('p');
            n.replaceWith(p);
            while (n.firstChild) p.appendChild(n.firstChild);
          }
          dirty = true;
        }
      });
    }
    // 空段落补 <br>，保证能在里面放光标
    doc.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.querySelector('br,img')) p.innerHTML = '<br>';
    });
    return doc.body.innerHTML;
  }
  function plainToHtml(text) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return text.split(/\r?\n/).map(line => {
      const t = esc(line);
      return t.trim() === '' ? '<p><br></p>' : '<p>' + t + '</p>';
    }).join('');
  }
  /* —— 块级归一化：粘贴/插入后，把画布的直接子节点里「裸文本 / 行内元素」强制包成 <p>。
     解决某些移动端粘贴时“首行不是段落”的问题（execCommand('insertHTML') 对块级结构处理不一致）。 —— */
  function ensureParagraphBlocks(root) {
    const BLOCK = new Set(BLOCK_TAGS);
    Array.from(root.childNodes).forEach(n => {
      if (n.nodeType === Node.TEXT_NODE) {
        if (n.textContent.trim()) {
          const p = document.createElement('p');
          root.replaceChild(p, n);
          p.appendChild(n);
        }
        // 纯空白文本（块间空白/换行）保持原样，不强行包 <p>
      } else if (n.nodeType === Node.ELEMENT_NODE && !BLOCK.has(n.tagName)) {
        // 行内元素（span/b/i/br/img 等）作为画布直接子级时，包成 <p>
        const p = document.createElement('p');
        root.replaceChild(p, n);
        p.appendChild(n);
      }
      // 块级元素（P/DIV/H1-H3/BLOCKQUOTE/LI）保持不变
    });
  }

  // 双保险：即使某些浏览器在 contenteditable=false 时仍派发了 beforeinput
  // （目前没见过这种情况，但保留兜底），编辑模式下一律拦截，不产生任何
  // 文字/换行/输入法组字的改动。
  canvas.addEventListener('beforeinput', (e) => {
    if (currentEditorMode === 'edit') e.preventDefault();
  });

  canvas.addEventListener('paste', (e) => {
    // 编辑模式禁止任何文字/内容输入（含粘贴）；正常情况下 contenteditable=false
    // 时浏览器本就不会派发 paste 到这里，这里只是双保险。
    if (currentEditorMode === 'edit') { e.preventDefault(); return; }
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length && files[0].type.indexOf('image/') === 0) {
      e.preventDefault();
      const r = new FileReader();
      r.onload = ev => { canvas.focus(); document.execCommand('insertImage', false, ev.target.result); };
      r.readAsDataURL(files[0]);
      return;
    }
    const html = e.clipboardData.getData('text/html');
    if (html && html.indexOf('<') !== -1) {
      e.preventDefault();
      snapshot();
      document.execCommand('insertHTML', false, sanitizePaste(html));
      ensureParagraphBlocks(canvas);   // 块级归一化：把首行裸文本/行内元素包成 <p>
      return;
    }
    const text = e.clipboardData.getData('text/plain');
    if (text) {
      e.preventDefault();
      snapshot();
      document.execCommand('insertHTML', false, plainToHtml(text));
      ensureParagraphBlocks(canvas);   // 块级归一化：把首行裸文本/行内元素包成 <p>
    }
  });

  /* ============ 模板（存完整样式 JSON） ============ */
  function captureStyles(b) {
    const cs = getComputedStyle(b);
    const fs = parseFloat(cs.fontSize);
    const lh = parseFloat(cs.lineHeight);
    const lhVal = fs ? Math.round((lh / fs) * 100) / 100 : cs.lineHeight;
    return {
      fontFamily: cs.fontFamily,
      fontSize: cs.fontSize,
      color: cs.color,
      lineHeight: lhVal,
      letterSpacing: cs.letterSpacing,
      textAlign: cs.textAlign,
      textIndent: cs.textIndent,
      marginTop: cs.marginTop,
      marginBottom: cs.marginBottom,
      writingMode: cs.writingMode,
      textOrientation: cs.textOrientation,
    };
  }

  let currentTab = 'para';

  function selectionHasMixedStyles() {
    if (!inlineRange) return false;
    const range = inlineRange;
    const keys = ['color', 'fontSize', 'fontWeight', 'fontStyle', 'textDecorationLine', 'fontFamily', 'letterSpacing'];
    const sets = keys.map(() => new Set());
    // 关键修复：之前只遍历 SPAN/FONT/B/I/U/STRONG/EM 这些“格式化标签”本身，
    // 于是没有被任何格式化标签包裹的纯文本（=“无样式”）完全不会进入统计——
    // 选中“无样式文字 + 加粗文字”时，加粗的 <b> 贡献一个 fontWeight 值，
    // 无样式文字什么都没贡献，集合 size 还是 1，就被误判成“格式统一”。
    // 改为遍历选区内所有文本节点，取其父元素的 computed style：
    // 无样式文字的父元素 computed fontWeight 是 normal，加粗文字的父元素是 bold，
    // 两者都会被放进集合，size > 1，才能正确识别出“混合了不同格式”。
    const walker = document.createTreeWalker(range.commonAncestorContainer, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) {
      if (!n.textContent.trim()) continue;
      // 用选区边界比较替代 intersectsNode，避免文本节点兼容性问题
      const nodeRange = document.createRange();
      try { nodeRange.selectNode(n); } catch (e) { continue; }
      const cmpStart = range.compareBoundaryPoints(Range.START_TO_END, nodeRange);
      const cmpEnd = range.compareBoundaryPoints(Range.END_TO_START, nodeRange);
      if (cmpStart < 0 || cmpEnd > 0) continue; // 节点完全在选区外
      const el = n.parentElement;
      if (!el) continue;
      const cs = getComputedStyle(el);
      keys.forEach((k, i) => sets[i].add(cs[k]));
    }
    return sets.some(s => s.size > 1);
  }

  function captureFontStyles() {
    if (!inlineRange) return null;
    let node = inlineRange.commonAncestorContainer;
    if (node.nodeType !== 1) node = node.parentElement;
    const cs = getComputedStyle(node);
    const fs = parseFloat(cs.fontSize);
    const lh = parseFloat(cs.lineHeight);
    return {
      color: cs.color,
      backgroundColor: cs.backgroundColor,
      fontSize: cs.fontSize,
      fontFamily: cs.fontFamily,
      letterSpacing: cs.letterSpacing,
      fontWeight: cs.fontWeight,
      fontStyle: cs.fontStyle,
      textDecoration: cs.textDecorationLine,
      lineHeight: fs ? Math.round((lh / fs) * 100) / 100 : cs.lineHeight,
    };
  }

  function captureCanvasStyles() {
    const cs = getComputedStyle(canvas);
    let bg = canvas.style.background || cs.backgroundColor;
    const m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) bg = '#' + [m[1], m[2], m[3]].map(c => (+c).toString(16).padStart(2, '0')).join('').toUpperCase();
    return {
      background: bg,
      width: cs.width,
      paddingLeft: cs.paddingLeft,
      paddingRight: cs.paddingRight,
      paddingTop: cs.paddingTop,
      paddingBottom: cs.paddingBottom,
    };
  }
  function reflectCanvasSliders() {
    const cs = getComputedStyle(canvas);
    const map = {
      canvasWidth: parseFloat(cs.width),
      padLeft: parseFloat(cs.paddingLeft),
      padRight: parseFloat(cs.paddingRight),
      padTop: parseFloat(cs.paddingTop),
      padBottom: parseFloat(cs.paddingBottom),
    };
    canvasSliders.forEach(cfg => {
      const v = map[cfg.id];
      if (v !== undefined) { cfg._range.value = v; cfg._num.value = v; }
    });
  }
  function applyCanvasStyles(styles) {
    Object.assign(canvas.style, styles);
    reflectCanvasSliders();
    syncPreviewBg();
  }

  /* ============ 自动保存项目（IndexedDB 主存储 + localStorage 兼容备份） ============
   * 停止编辑一段时间后，把画布内容（文字 + 段落/字体行内格式，都在
   * canvas.innerHTML 里）和画布级格式（宽度/内边距/背景，在 #canvas
   * 自己的 style 上）作为“项目数据模型”存进 IndexedDB（ProjectStorage）；
   * localStorage 仅作为同构的轻量备份 + 旧数据迁移来源。下次打开页面自动读回。
   * 用 MutationObserver 监听 #canvas 子树的内容变化 + style 属性变化，
   * 不用在“改文字/改行内格式/改段落格式/改画布格式”每个入口分别调用
   * 保存——包括撤销/重做/应用模板/导入数据，这些操作最终都会落到
   * canvas 的 DOM 变化上，天然会触发一次 mutation。
   * 这里的“是否忽略行内覆盖提示”单独存在另一个 localStorage key
   * 里（见上面 overrideWarnIgnored），不算进草稿数据，也不会随草稿
   * 一起被清空、导出或导入。 */
  const DRAFT_KEY = 'longimage-editor-draft-v1';
  // 预留：如果以后升级存储 key/数据结构，把旧 key 按“新→旧”顺序加进这里，
  // readLegacyDraft() 会按优先级依次尝试读取，保证旧数据不会因为改名就读不到；
  // 读到旧 key 后只在内存里用，不会立刻用新 key 覆写旧 key（避免数据污染），
  // 真正写回只走 IndexedDB，下一次自动保存自然会落盘。
  const LEGACY_DRAFT_KEYS = [];
  const DRAFT_DEBUG = '[draft]';
  const PS_DEBUG = '[ProjectStorage]';

  // ProjectStorage：IndexedDB 持久化存储层。编辑器 UI 不直接操作 IndexedDB。
  const projectStorage = new ProjectStorage();

  function collectDraftData() {
    return { format: 'longimage-editor', version: 1, html: canvas.innerHTML, canvasStyle: captureCanvasStyles(), savedAt: Date.now() };
  }
  let quotaWarned = false;

  // 主落盘：写 IndexedDB。这是“用户编辑数据”唯一的主存储，完全独立于 HTTP Cache。
  function persistProject(data) {
    return projectStorage.save(data).catch(err => {
      console.error(PS_DEBUG, 'error 自动保存到 IndexedDB 失败', err);
      if (!quotaWarned) {
        quotaWarned = true;
        showToast('自动保存到 IndexedDB 失败，请确认浏览器未禁用本站存储。\n建议尽快手动“导出数据”备份一份。', 6000);
      }
    });
  }

  // 真正落盘：从“定时防抖保存”里拆出来，这样既能被 debounce 定时器调用，
  // 也能在“页面即将被隐藏/冻结/杀掉”之类的时机被直接、立即调用一次，
  // 不必等 1200ms 的计时器——移动端浏览器切后台/杀进程时不保证还有时间跑完
  // 一个未触发的 setTimeout。主落盘走 IndexedDB；localStorage 同步写入作为兜底
  // （页面被回收时 IndexedDB 异步写可能来不及，localStorage 同步写能保住最新值，
  // 下次启动恢复时会在两者中按 savedAt 取更新的一份并回迁到 IndexedDB）。
  function flushDraftNow(reason) {
    clearTimeout(autosaveTimer);
    const data = collectDraftData();
    persistProject(data);
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
      console.info(DRAFT_DEBUG, '保存成功(备份到 localStorage)', { key: DRAFT_KEY, reason: reason || 'timer' });
    } catch (e) {
      // 容量超限（比如粘贴了大图片转成 base64）或隐私模式下不可用：
      // 静默失败但不清空/不覆盖已有数据——现有的 localStorage 内容保持原样，
      // 只是这一次的新改动没能落盘。IndexedDB 主存储不受影响。
      console.error(DRAFT_DEBUG, 'localStorage 备份失败，IndexedDB 主存储不受影响', e);
      if (!quotaWarned) {
        quotaWarned = true;
        showToast('当前编辑内容较大，自动保存可能失败（常见于粘贴了大图片）。\n建议尽快手动“导出数据”备份一份。', 6000);
      }
    }
  }
  let autosaveTimer = null;
  let lastMutationTime = 0;
  function scheduleAutosave() {
    lastMutationTime = Date.now();
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      // 如果 1200ms 内又有新 mutation，说明还在连续操作，再推迟
      if (Date.now() - lastMutationTime < 1000) {
        scheduleAutosave();
        return;
      }
      flushDraftNow('debounce');
    }, 1200);
  }
  new MutationObserver(scheduleAutosave).observe(canvas, {

  function readLegacyDraft() {
    const keysToTry = [DRAFT_KEY, ...LEGACY_DRAFT_KEYS];
    for (const key of keysToTry) {
      let raw;

        console.error(DRAFT_DEBUG, '读取旧数据失败', key, e);

      }

      let data;
      try { data = JSON.parse(raw); } catch (e) {

  function migrateLegacyDraft(data) {
    if (!data || typeof data !== 'object' || typeof data.html !== 'string') return;
    console.info(PS_DEBUG, 'migration completed: 旧 localStorage 数据迁往 IndexedDB');
    projectStorage.save(data).catch(err => {
      console.error(PS_DEBUG, 'error 迁移到 IndexedDB 失败', err);

  async function restoreProject() {
    console.info(PS_DEBUG, 'loading current project');
    let record = null;
    try {
      record = await projectStorage.load();
    } catch (e) {
      // 读取失败：不做任何破坏性操作，保留数据，只记错误（见需求第六节）
      console.error(PS_DEBUG, 'error 读取 IndexedDB 项目失败，保留现有数据不做任何清除', e);
    }

    const legacy = readLegacyDraft();

    if (record && record.data) {
      const recSavedAt = (record.data && record.data.savedAt) || record.updatedAt || 0;
      const legSavedAt = (legacy && legacy.savedAt) || 0;
      // 若旧 localStorage 比 IndexedDB 更新（例如页面被回收时 IndexedDB 异步写被截断、
      // 而 localStorage 同步写成功），则用 localStorage 那份，并回迁到 IndexedDB。
      if (legacy && legSavedAt > recSavedAt) {
        console.info(PS_DEBUG, 'legacy 数据更新，优先使用旧 localStorage 并回迁');
        const ok = applyProjectData(legacy);
        if (ok) migrateLegacyDraft(legacy);
        console.info(PS_DEBUG, 'restore completed (legacy newer)');
        return 'legacy';
      }
      console.info(PS_DEBUG, 'project found', { version: record.version, updatedAt: record.updatedAt });
      const ok = applyProjectData(record.data);
      if (!ok) console.warn(PS_DEBUG, 'project data 格式不兼容，跳过（不覆盖原数据）');
      console.info(PS_DEBUG, 'restore completed');
      return 'indexeddb';

    // IndexedDB 没有项目：尝试旧 localStorage（迁移 + 兼容）
    if (legacy) {
      console.info(PS_DEBUG, 'legacy draft found, migrating', { savedAt: legacy.savedAt });
      const ok = applyProjectData(legacy);
      if (ok) {
        migrateLegacyDraft(legacy);
        console.info(PS_DEBUG, 'restore completed (legacy)');
        return 'legacy';
      }

    return 'default';
  }

  function charOffsetOfBoundary(root, container, offset) {
    const r = document.createRange();
    try { r.setStart(root, 0); r.setEnd(container, offset); } catch (e) { return 0; }
    return r.toString().length;
  }
  // 用「全局字符偏移」在 root 上重建 Range。拆分 span 会改变文本节点划分，但不会改变文本顺序，
  // 所以每次迭代都用字符偏移重建 Range，避免旧 Range 的 offset 因文本节点被拆分而失效。
  function rangeByCharOffsets(root, startChars, endChars) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n, acc = 0, sn = null, so = 0, en = null, eo = 0;
    while ((n = walker.nextNode())) {
      const len = n.textContent.length;
      if (sn === null && startChars <= acc + len) { sn = n; so = startChars - acc; }
      if (en === null && endChars <= acc + len) { en = n; eo = endChars - acc; }
      if (sn && en) break;
      acc += len;
    }
    if (!sn) { sn = root; so = 0; }
    if (!en) { en = root; eo = root.childNodes.length; }
    const r = document.createRange();
    try { r.setStart(sn, so); r.setEnd(en, eo); return r; } catch (e) { return null; }
  }
  // 反复处理直到不再变化：完整覆盖的包装直接解包，部分覆盖的包装拆分后中段去掉格式。
  // startChars/endChars = 选区起点/终点在 root 文本内容中的字符偏移（拆分 span 后仍稳定）。
  function cleanInlineFormattingInRange(root, startChars, endChars) {
    let guard = 0;
    while (guard++ < 200) {
      const range = rangeByCharOffsets(root, startChars, endChars);
      if (!range) break;
      const carriers = collectInlineCarriers(root);
      let acted = false;
      for (const el of carriers) {
        if (!el.isConnected) continue;
        const clipped = clampRangeToEl(el, range);
        if (!clipped) continue;
        if (rangeFullyCoversEl(clipped, el)) {
          while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
          el.remove();
          acted = true;
          break;
        } else {
          sliceCarrier(el, clipped);
          acted = true;
          break;
        }
      }
      if (!acted) break;
    }
  }
  function clearFontFormat(rangeOverride) {
    let range = rangeOverride;
    // 允许没有预存 inlineRange、只是临时选中了一段文字时也能清除。
    if (!range) {
      const sel = window.getSelection();
      if (sel.rangeCount && !sel.isCollapsed && selectionInCanvas()) range = sel.getRangeAt(0).cloneRange();
    }
    if (!range) { alert('先选中要清除格式的文字'); return; }
    const block = getFontBlock(range);   // 跨段落会提示「字体格式不支持跨段落编辑」
    if (!block) return;
    snapshot();
    const sel = window.getSelection();
    canvas.focus();
    sel.removeAllRanges();
    sel.addRange(range.cloneRange());

    if (hasNesting(block)) normalizeBlock(block);
    const startC = charOffsetInBlock(block, range.startContainer, range.startOffset);
    const endC = charOffsetInBlock(block, range.endContainer, range.endOffset);

    // ① 标记「被选区完整覆盖」的旧 span（整段选满 → 删除整个 span）
    let acc0 = 0;
    Array.from(block.childNodes).forEach(run => {
      const rs = acc0, re = acc0 + nodeTextLen(run);
      acc0 = re;
      if (run.nodeType === Node.ELEMENT_NODE && run.tagName === 'SPAN' && run.hasAttribute('data-fid')) {
        if (rs >= startC && re <= endC) run.setAttribute('data-fullsel', '1');
      }
    });
    // ② 按选区边界切开（部分覆盖的 span 被切成新 run）
    splitRunsAt(block, [startC, endC]);
    // ③ 处理：带标记(整段选满)→删除整个 span；无标记(新切的选中块)→清空样式、保留新 fid（空白 span）
    let acc = 0;
    Array.from(block.childNodes).forEach(run => {
      const rs = acc, re = acc + nodeTextLen(run);
      acc = re;
      if (!(rs >= startC && re <= endC)) return;
      if (run.nodeType !== Node.ELEMENT_NODE || run.tagName !== 'SPAN' || !run.hasAttribute('data-fid')) return;
      if (run.hasAttribute('data-fullsel')) {
        while (run.firstChild) block.insertBefore(run.firstChild, run);
        run.remove();
      } else {
        FONT_PROPS.forEach(p => { run.style[p] = ''; });
        ['color', 'face', 'size'].forEach(a => run.removeAttribute(a));
      }
    });
    block.querySelectorAll('[data-fullsel]').forEach(el => el.removeAttribute('data-fullsel'));

    // 相邻同样式合并：清除后左右两边可能残留同格式的 span，收敛成一个（并换新 fid + normalize）
    mergeAdjacentRuns(block);

    inlineRange = rangeBlock(block, startC, endC);
    const s2 = window.getSelection();
    if (inlineRange) { s2.removeAllRanges(); s2.addRange(inlineRange); }
    updateSelectionUI();
  }
  function clearParagraphFormat(blocksOverride) {
    const blocks = blocksOverride && blocksOverride.length ? blocksOverride.slice() : getTargetBlocks();
    if (!blocks.length) { alert('先把光标放到目标段落里'); return; }
    snapshot();
    blocks.forEach(b => { b.removeAttribute('style'); b.className = ''; });
    blocks.forEach(applyParagraphAlignment);
    updateSelectionUI();
  }
  function clearCanvasProperties() {
    snapshot();
    canvas.removeAttribute('style');
    canvas.className = '';
    reflectCanvasSliders();
    syncPreviewBg();
  }
  function clearAllContent() {
    snapshot();
    canvas.innerHTML = '';
    activeBlocks = [];
    inlineRange = null;
    updateSelectionUI();
  }
  function executeClearAction(action) {
    const labels = { paragraph: '段落格式', font: '字体格式', canvas: '画布属性', content: '输入文字' };
    if (!canClearAction(action)) { alert(action === 'font' ? '先选中要清除格式的文字' : '先把光标放到目标段落里'); return; }
    showModal('确定要清除“' + labels[action] + '”吗？', [

  clearMenuBtn.addEventListener('pointerdown', () => {

  /* ============ 渲染模板区（三 Tab） ============ */
  function getCanvasBg() {

  }
  function syncPreviewBg() {
    const bg = getCanvasBg();

  }
  const TAB_HINTS = { para: '光标放到段落可存段落样式。', font: '选中文字可存字体样式。' };
  function render() {
    const sideHint = document.getElementById('sideHint');

    templateList.innerHTML = '';

    if (!list.length) {

      const preview = document.createElement('p');

          + '\n上边距 ' + s.paddingTop + ' · 下边距 ' + s.paddingBottom;

      apply.addEventListener('click', () => applyTemplate(t.id));

      del.type = 'button';
      del.className = 'del';

  /* Tab 切换 */
  document.getElementById('tplTabs').querySelectorAll('.tpl-tab').forEach(btn => {
